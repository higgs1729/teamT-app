<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3DゾンビサバイバルFPS - 拡張版</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            user-select: none;
            background-color: #05050a;
        }
        /* 画面中央の照準（レティクル） */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            border: 2px solid #00ffcc;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }
        #crosshair::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 4px;
            height: 4px;
            background: #00ffcc;
            border-radius: 50%;
        }
        /* HUD (スコア、タイマー、HP、弾薬) */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            z-index: 10;
            text-shadow: 2px 2px 4px #000;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .hud-item {
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 15px;
            border-radius: 5px;
            border-left: 4px solid #ff3333;
        }
        #hp-bar-container {
            width: 200px;
            height: 15px;
            background: #333;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 5px;
        }
        #hp-bar {
            width: 100%;
            height: 100%;
            background: #ff3333;
            transition: width 0.1s ease;
        }
        /* リロード中のUI表示 */
        #reload-indicator {
            position: absolute;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            color: #ffcc00;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            display: none;
            z-index: 10;
        }
        /* メニュー・案内・リザルト表示 */
        #overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(10, 10, 15, 0.85);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
            text-align: center;
        }
        .btn {
            background: #ff3355;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 0 15px rgba(255, 51, 85, 0.4);
            transition: 0.2s;
        }
        .btn:hover {
            background: #ff5577;
            transform: scale(1.05);
        }
        /* 戦績表示用 */
        #results {
            display: none;
            background: rgba(20, 20, 30, 0.9);
            border: 2px solid #ff3355;
            padding: 30px;
            border-radius: 10px;
            max-width: 400px;
            width: 80%;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 18px;
            border-bottom: 1px dashed #444;
            padding-bottom: 5px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="reload-indicator">RELOADING...</div>
    
    <div id="hud">
        <div class="hud-item" style="border-left-color: #00ffcc;">タイム: <span id="timer">60</span>s</div>
        <div class="hud-item" style="border-left-color: #ffcc00;">倒した数: <span id="kill-count">0</span></div>
        <div class="hud-item" style="border-left-color: #00aaff;">弾薬: <span id="ammo-clip">12</span> / <span id="ammo-reserve">36</span></div>
        <div class="hud-item">
            HP: <span id="hp-text">100</span>
            <div id="hp-bar-container"><div id="hp-bar"></div></div>
        </div>
    </div>

    <div id="overlay">
        <!-- スタート画面 -->
        <div id="start-menu">
            <h1 style="font-size: 42px; margin-bottom: 10px; color: #ff3355; text-shadow: 0 0 10px rgba(255,51,85,0.5);">ZOMBIE SURVIVAL 3D</h1>
            <p style="font-size: 18px; color: #aaa;">暗闇から迫り来るゾンビを撃ち倒し、60秒間生き延びろ！</p>
            <button class="btn">ゲーム開始</button>
            <p style="color: #888; font-size: 14px; margin-top: 25px; line-height: 1.6;">
                【操作方法】<br>
                移動: W, A, S, D ｜ 視点: マウス移動 ｜ 射撃: 左クリック<br>
                リロード: R キー ｜ ポインターロック解除: Esc キー
            </p>
        </div>

        <!-- リザルト画面 -->
        <div id="results">
            <h2 id="result-title" style="font-size: 28px; color: #ff3355; margin-top: 0;">GAME OVER</h2>
            <div class="result-row"><span>撃退したゾンビ:</span><span id="res-kills" style="color: #ffcc00; font-weight:bold;">0</span></div>
            <div class="result-row"><span>発射弾数:</span><span id="res-shots">0</span></div>
            <div class="result-row"><span>命中率:</span><span id="res-accuracy" style="color: #00ffcc;">0%</span></div>
            <div class="result-row"><span>スコア:</span><span id="res-score" style="color: #ff3355; font-weight:bold;">0</span></div>
            <button class="btn" id="retry-btn">もう一度挑戦</button>
        </div>
    </div>

    <script>
        // --- ゲーム状態管理 ---
        let gameActive = false;
        let hp = 100;
        let timeLeft = 60;
        let killCount = 0;
        let shotsFired = 0;
        let shotsHit = 0;
        let score = 0;
        let timerInterval;

        // --- 弾薬・リロード設定 ---
        let ammoInClip = 12;
        const clipSize = 12;
        let ammoReserve = 36;
        const maxReserve = 120;
        let isReloading = false;
        let reloadTimer = 0;
        const reloadDuration = 1.2; // リロードにかかる時間（秒）

        // --- 基本設定 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x05050a); 
        scene.fog = new THREE.FogExp2(0x05050a, 0.012); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        // カメラをシーンに追加（手元の銃をカメラの子要素にするため必須）
        scene.add(camera);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- ライティング ---
        const ambientLight = new THREE.AmbientLight(0x555566,1.5); 
        scene.add(ambientLight);

        const flashlight = new THREE.SpotLight(0xffffff, 3.0, 60, Math.PI / 4, 0.5, 1);
        flashlight.castShadow = true;
        scene.add(flashlight);
        scene.add(flashlight.target); 

        // --- 地面と障害物 ---
        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x111115, roughness: 0.9 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const gridHelper = new THREE.GridHelper(100, 50, 0x222233, 0x111122);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        const wallGeo = new THREE.BoxGeometry(4, 8, 4);
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x2d2d35, roughness: 0.7 });
        for (let i = 0; i < 20; i++) {
            const wall = new THREE.Mesh(wallGeo, wallMat);
            wall.position.x = (Math.random() - 0.5) * 80;
            wall.position.z = (Math.random() - 0.5) * 80;
            wall.position.y = 4;
            wall.castShadow = true;
            wall.receiveShadow = true;
            scene.add(wall);
        }

        // --- プレイヤー手元の銃モデル作成 ---
        const gunGroup = new THREE.Group();
        
        // 銃身（バレル）
        const barrelGeo = new THREE.CylinderGeometry(0.025, 0.025, 0.35, 8);
        barrelGeo.rotateX(Math.PI / 2); // 前方を向かせる
        const barrelMat = new THREE.MeshStandardMaterial({ color: 0x222226, metalness: 0.8, roughness: 0.3 });
        const barrel = new THREE.Mesh(barrelGeo, barrelMat);
        gunGroup.add(barrel);

        // スライド・本体
        const bodyGeo = new THREE.BoxGeometry(0.06, 0.07, 0.3);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1c, metalness: 0.7, roughness: 0.4 });
        const gunBody = new THREE.Mesh(bodyGeo, bodyMat);
        gunBody.position.set(0, 0.02, 0.02);
        gunGroup.add(gunBody);

        // グリップ（持ち手）
        const gripGeo = new THREE.BoxGeometry(0.05, 0.12, 0.05);
        const gripMat = new THREE.MeshStandardMaterial({ color: 0x0f0f10, roughness: 0.8 });
        const grip = new THREE.Mesh(gripGeo, gripMat);
        grip.position.set(0, -0.07, 0.08);
        grip.rotation.x = -Math.PI / 6; // 少し傾ける
        gunGroup.add(grip);

        // 銃の初期配置（画面の右下・手前に設定）
        const defaultGunPos = new THREE.Vector3(0.2, -0.22, -0.4);
        gunGroup.position.copy(defaultGunPos);
        camera.add(gunGroup); // カメラの移動・回転に完全に同期させる

        let recoilVelocity = 0;
        let recoilOffset = 0;

        // --- プレイヤーの設定 ---
        camera.position.set(0, 1.6, 0);
        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;

        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        let prevTime = performance.now();

        let pitch = 0;
        let yaw = 0;

        // --- ポインターロック ---
        const overlay = document.getElementById('overlay');
        const startMenu = document.getElementById('start-menu');
        const resultsMenu = document.getElementById('results');

        overlay.addEventListener('click', (e) => {
            if (e.target.tagName === 'BUTTON') return;
            if (gameActive) {
                document.body.requestPointerLock();
            }
        });

        document.getElementById('retry-btn').addEventListener('click', () => {
            initGame();
            document.body.requestPointerLock();
        });

        startMenu.querySelector('button').addEventListener('click', () => {
            initGame();
            document.body.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === document.body) {
                overlay.style.display = 'none';
                if (!gameActive) gameActive = true;
            } else {
                overlay.style.display = 'flex';
                if (hp <= 0 || timeLeft <= 0) {
                    startMenu.style.display = 'none';
                    resultsMenu.style.display = 'block';
                } else {
                    startMenu.style.display = 'block';
                    resultsMenu.style.display = 'none';
                    startMenu.querySelector('h1').textContent = "PAUSED";
                    startMenu.querySelector('p').textContent = "クリックして再開";
                }
            }
        });

        // 視点移動
        document.addEventListener('mousemove', (event) => {
            if (document.pointerLockElement !== document.body) return;

            const sensitivity = 0.002;
            yaw -= event.movementX * sensitivity;
            pitch -= event.movementY * sensitivity;
            pitch = Math.max(-Math.PI / 2 + 0.05, Math.min(Math.PI / 2 - 0.05, pitch));

            const qx = new THREE.Quaternion();
            qx.setFromAxisAngle(new THREE.Vector3(1, 0, 0), pitch);
            const qy = new THREE.Quaternion();
            qy.setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

            camera.quaternion.copy(qy).multiply(qx);
        });

        // キー入力
        const onKeyDown = (event) => {
            switch (event.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyD': moveRight = true; break;
                case 'KeyR': startReload(); break; // Rで手動リロード
            }
        };

        const onKeyUp = (event) => {
            switch (event.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyD': moveRight = false; break;
            }
        };

        document.addEventListener('keydown', onKeyDown);
        document.addEventListener('keyup', onKeyUp);

        // --- リロード処理 ---
        function startReload() {
            if (isReloading || ammoInClip === clipSize || ammoReserve <= 0) return;
            isReloading = true;
            reloadTimer = reloadDuration;
            document.getElementById('reload-indicator').style.display = 'block';
        }

        // --- 弾（バレット）システム ---
        const bullets = [];
        const bulletSpeed = 120;

        const shoot = () => {
            if (document.pointerLockElement !== document.body || !gameActive) return;
            
            // リロード中は撃てない
            if (isReloading) return;

            // 弾切れ時は自動リロード
            if (ammoInClip <= 0) {
                startReload();
                return;
            }

            ammoInClip--;
            shotsFired++;
            updateHUD();

            // 発砲反動（リコイル）発生
            recoilOffset = 0.08; 

            const bulletGeo = new THREE.SphereGeometry(0.08, 8, 8);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0x00ffff }); 
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);

            bullet.position.copy(camera.position);
            bullet.position.y -= 0.15; // 銃口付近から発射

            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            
            bullet.userData = {
                direction: dir.clone(),
                createdAt: performance.now()
            };

            scene.add(bullet);
            bullets.push(bullet);
        };

        document.addEventListener('mousedown', (e) => {
            if (e.button === 0) shoot(); // 左クリックで射撃
        });

        // --- ドロップアイテムシステム ---
        const drops = [];

        const spawnDropItem = (x, z) => {
            // 50%の確率でアイテムドロップ
            if (Math.random() > 0.5) return;

            const isHpPack = Math.random() > 0.4; // 60%の確率でHP、40%で弾薬
            const dropGroup = new THREE.Group();

            let boxGeo, boxMat;
            if (isHpPack) {
                // 回復薬：鮮やかな緑の十字マーク入り風
                boxGeo = new THREE.BoxGeometry(0.35, 0.35, 0.35);
                boxMat = new THREE.MeshStandardMaterial({ 
                    color: 0x00ff66, 
                    emissive: 0x004411, 
                    roughness: 0.2 
                });
            } else {
                // 弾薬箱：ミリタリー調のオレンジイエロー
                boxGeo = new THREE.BoxGeometry(0.3, 0.25, 0.4);
                boxMat = new THREE.MeshStandardMaterial({ 
                    color: 0xffaa00, 
                    emissive: 0x553300, 
                    roughness: 0.4 
                });
            }

            const box = new THREE.Mesh(boxGeo, boxMat);
            box.castShadow = true;
            dropGroup.add(box);

            dropGroup.position.set(x, 0.3, z);
            scene.add(dropGroup);

            drops.push({
                mesh: dropGroup,
                type: isHpPack ? 'hp' : 'ammo',
                spawnTime: performance.now()
            });
        };

        // --- ゾンビ（エネミー）システム ---
        const zombies = [];
        const zombieSpeed = 4.5; 

        const createZombieMesh = () => {
            const zombieGroup = new THREE.Group();

            // 体
            const bodyGeo = new THREE.CylinderGeometry(0.4, 0.2, 1.2, 8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1a331a, roughness: 0.8 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.6;
            body.castShadow = true;
            zombieGroup.add(body);

            // 頭
            const headGeo = new THREE.SphereGeometry(0.3, 8, 8);
            const headMat = new THREE.MeshStandardMaterial({ color: 0x2e5c2e, roughness: 0.6 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.3;
            head.castShadow = true;
            zombieGroup.add(head);

            // 赤く光る目
            const eyeGeo = new THREE.SphereGeometry(0.05, 4, 4);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            
            const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
            leftEye.position.set(-0.1, 1.35, 0.25);
            const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
            rightEye.position.set(0.1, 1.35, 0.25);
            
            zombieGroup.add(leftEye);
            zombieGroup.add(rightEye);

            return zombieGroup;
        };

        const spawnZombie = () => {
            const zombie = createZombieMesh();

            let x, z, dist;
            do {
                x = (Math.random() - 0.5) * 70;
                z = (Math.random() - 0.5) * 70;
                dist = Math.hypot(x - camera.position.x, z - camera.position.z);
            } while (dist < 15); 

            zombie.position.set(x, 0, z);
            scene.add(zombie);
            zombies.push(zombie);
        };

        // --- ゲームの初期化・リセット ---
        function initGame() {
            // 古いオブジェクトの全削除
            zombies.forEach(z => scene.remove(z));
            bullets.forEach(b => scene.remove(b));
            drops.forEach(d => scene.remove(d.mesh));
            zombies.length = 0;
            bullets.length = 0;
            drops.length = 0;

            // ステータスの初期化
            hp = 100;
            timeLeft = 60;
            killCount = 0;
            shotsFired = 0;
            shotsHit = 0;
            score = 0;
            ammoInClip = clipSize;
            ammoReserve = 36;
            isReloading = false;
            document.getElementById('reload-indicator').style.display = 'none';

            gameActive = true;

            camera.position.set(0, 1.6, 0);
            pitch = 0;
            yaw = 0;

            updateHUD();

            // ゾンビの初期スポーン
            for (let i = 0; i < 8; i++) {
                spawnZombie();
            }

            // タイマー開始
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (document.pointerLockElement === document.body && gameActive) {
                    timeLeft--;
                    updateHUD();

                    if (timeLeft % 10 === 0 && zombies.length < 15) {
                        spawnZombie();
                    }

                    if (timeLeft <= 0) {
                        endGame(true); // 生存クリア
                    }
                }
            }, 1000);
        }

        // HUD表示の更新
        function updateHUD() {
            document.getElementById('timer').textContent = timeLeft;
            document.getElementById('kill-count').textContent = killCount;
            document.getElementById('hp-text').textContent = Math.ceil(hp);
            document.getElementById('hp-bar').style.width = hp + '%';
            document.getElementById('ammo-clip').textContent = ammoInClip;
            document.getElementById('ammo-reserve').textContent = ammoReserve;
        }

        // ゲーム終了処理
        function endGame(isClear) {
            gameActive = false;
            clearInterval(timerInterval);
            document.exitPointerLock();

            const accuracy = shotsFired > 0 ? Math.round((shotsHit / shotsFired) * 100) : 0;
            score = (killCount * 150) + (accuracy * 10) + (isClear ? (Math.ceil(hp) * 20) : 0);

            const resultTitle = document.getElementById('result-title');
            if (isClear) {
                resultTitle.textContent = "MISSION CLEAR!";
                resultTitle.style.color = "#00ffcc";
            } else {
                resultTitle.textContent = "YOU DIED";
                resultTitle.style.color = "#ff3355";
            }

            document.getElementById('res-kills').textContent = killCount;
            document.getElementById('res-shots').textContent = shotsFired;
            document.getElementById('res-accuracy').textContent = accuracy + "%";
            document.getElementById('res-score').textContent = score;

            startMenu.style.display = 'none';
            resultsMenu.style.display = 'block';
            overlay.style.display = 'flex';
        }

        // --- メインゲームループ ---
        const animate = () => {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if (document.pointerLockElement === document.body && gameActive) {
                // プレイヤーの移動
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                const camDir = new THREE.Vector3();
                camera.getWorldDirection(camDir);
                camDir.y = 0;
                camDir.normalize();

                const camRight = new THREE.Vector3();
                camRight.crossVectors(camDir, new THREE.Vector3(0, 1, 0)).normalize();

                if (moveForward || moveBackward) velocity.z += direction.z * 100.0 * delta;
                if (moveLeft || moveRight) velocity.x += direction.x * 100.0 * delta;

                camera.position.addScaledVector(camDir, velocity.z * delta);
                camera.position.addScaledVector(camRight, velocity.x * delta);

                camera.position.x = Math.max(-48, Math.min(48, camera.position.x));
                camera.position.z = Math.max(-48, Math.min(48, camera.position.z));

                // フラッシュライト同期
                flashlight.position.copy(camera.position);
                const lightTargetPos = new THREE.Vector3();
                camera.getWorldDirection(lightTargetPos);
                flashlight.target.position.copy(camera.position).add(lightTargetPos);

                // --- 銃のアニメーション処理 ---
                // リコイル反動の計算
                if (recoilOffset > 0) {
                    recoilOffset -= 0.5 * delta; // 素早く元の位置に戻る
                    if (recoilOffset < 0) recoilOffset = 0;
                }

                if (isReloading) {
                    reloadTimer -= delta;
                    // リロードモーション：銃を傾けて手前に引く
                    const progress = reloadTimer / reloadDuration; // 1.0 (開始) -> 0.0 (完了)
                    const angle = Math.sin(progress * Math.PI) * -0.6; // 傾き
                    gunGroup.rotation.z = angle;
                    gunGroup.rotation.x = angle * 0.5;
                    gunGroup.position.set(
                        defaultGunPos.x,
                        defaultGunPos.y - Math.sin(progress * Math.PI) * 0.15,
                        defaultGunPos.z + recoilOffset
                    );

                    if (reloadTimer <= 0) {
                        isReloading = false;
                        document.getElementById('reload-indicator').style.display = 'none';
                        gunGroup.rotation.set(0, 0, 0);
                        
                        // 弾薬の再装填計算
                        const needed = clipSize - ammoInClip;
                        const transfer = Math.min(needed, ammoReserve);
                        ammoInClip += transfer;
                        ammoReserve -= transfer;
                        updateHUD();
                    }
                } else {
                    // 通常時（射撃の反動を反映）
                    gunGroup.position.set(defaultGunPos.x, defaultGunPos.y, defaultGunPos.z + recoilOffset);
                }
            }

            // --- ドロップアイテムの浮遊＆回収判定 ---
            if (gameActive) {
                const playerPos = new THREE.Vector3(camera.position.x, 0, camera.position.z);
                
                for (let i = drops.length - 1; i >= 0; i--) {
                    const drop = drops[i];
                    
                    // アイテムを回転・浮遊させる
                    drop.mesh.rotation.y += 1.5 * delta;
                    drop.mesh.position.y = 0.35 + Math.sin(time * 0.005) * 0.08;

                    // プレイヤーとの距離判定
                    const distToPlayer = drop.mesh.position.distanceTo(playerPos);
                    if (distToPlayer < 1.4) {
                        // 回収エフェクト＆ステータス反映
                        if (drop.type === 'hp') {
                            hp = Math.min(100, hp + 30); // HPを30回復
                        } else {
                            ammoReserve = Math.min(maxReserve, ammoReserve + 24); // 予備弾薬を2クリップ分回復
                        }
                        updateHUD();

                        // シーンから削除
                        scene.remove(drop.mesh);
                        drops.splice(i, 1);
                    }
                }
            }

            // --- ゾンビのAI移動 & 攻撃判定 ---
            if (gameActive && document.pointerLockElement === document.body) {
                zombies.forEach((zombie) => {
                    const targetPos = new THREE.Vector3(camera.position.x, 0, camera.position.z);
                    zombie.lookAt(targetPos);

                    const dir = new THREE.Vector3().subVectors(targetPos, zombie.position).normalize();
                    zombie.position.addScaledVector(dir, zombieSpeed * delta);

                    const distToPlayer = zombie.position.distanceTo(new THREE.Vector3(camera.position.x, 0, camera.position.z));
                    if (distToPlayer < 1.2) {
                        hp -= 20 * delta; 
                        hp = Math.max(0, hp);
                        updateHUD();

                        if (hp <= 0) {
                            endGame(false); 
                        }
                    }
                });
            }

            // --- 弾の移動 & 衝突判定 ---
            const bulletLifespan = 1500; 
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.position.addScaledVector(b.userData.direction, bulletSpeed * delta);

                if (time - b.userData.createdAt > bulletLifespan || b.position.y < 0) {
                    scene.remove(b);
                    bullets.splice(i, 1);
                    continue;
                }

                // ゾンビとの当たり判定
                for (let j = zombies.length - 1; j >= 0; j--) {
                    const z = zombies[j];
                    const zombieCenter = new THREE.Vector3(z.position.x, 0.9, z.position.z);
                    const dist = b.position.distanceTo(zombieCenter);

                    if (dist < 1.0) { 
                        shotsHit++;
                        
                        // 倒したゾンビの位置にアイテムをドロップ
                        spawnDropItem(z.position.x, z.position.z);

                        scene.remove(z);
                        zombies.splice(j, 1);

                        scene.remove(b);
                        bullets.splice(i, 1);

                        spawnZombie();
                        if (Math.random() > 0.6 && zombies.length < 15) {
                            spawnZombie(); 
                        }

                        killCount++;
                        updateHUD();
                        break;
                    }
                }
            }

            prevTime = time;
            renderer.render(scene, camera);
        };

        // リサイズ対応
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
