<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Undertale風 回避ゲーム</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    flex-direction:column;
}

#ui{
    width:500px;
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
    font-size:20px;
}

#game{
    width:500px;
    height:500px;
    border:6px solid white;
    background:black;
    position:relative;
    overflow:hidden;
}

#player{
    position:absolute;
    width:24px;
    height:24px;
}

/* ハート本体 */
#player::before,
#player::after{
    content:"";
    position:absolute;
    width:14px;
    height:22px;
    background:#ff2020;
    border-radius:14px 14px 0 0;
}

#player::before{
    left:10px;
    transform:rotate(-45deg);
    transform-origin:0 100%;
}

#player::after{
    left:0;
    transform:rotate(45deg);
    transform-origin:100% 100%;
}

.bone{
    position:absolute;
    display:flex;
    align-items:center;
    height:20px;
}

.boneBody{
    background:white;
    height:10px;
    flex:1;
}

.boneHead{
    width:14px;
    height:20px;
    background:white;
    border-radius:5px;
}

.boneHead.left{
    margin-right:-2px;
}

.boneHead.right{
    margin-left:-2px;
}

button{
    margin-top:15px;
    padding:10px 20px;
    font-size:18px;
}
</style>

</head>
<body>

<div id="ui">
<div>HP：<span id="hp">5</span></div>
<div>TIME：<span id="time">0</span></div>
</div>

<div id="game">
<div id="player"></div>
</div>

<button onclick="restart()">リスタート</button>

<script>

const game=document.getElementById("game");
const player=document.getElementById("player");

let px=240;
let py=430;

const speed=4;

let hp=5;
let time=0;

let keys={};

let bones=[];

let playing=true;

document.addEventListener("keydown",e=>{
keys[e.key]=true;
});

document.addEventListener("keyup",e=>{
keys[e.key]=false;
});

function updatePlayer(){

if(keys["ArrowLeft"]||keys["a"])
px-=speed;

if(keys["ArrowRight"]||keys["d"])
px+=speed;

if(keys["ArrowUp"]||keys["w"])
py-=speed;

if(keys["ArrowDown"]||keys["s"])
py+=speed;

px=Math.max(0,Math.min(482,px));
py=Math.max(0,Math.min(482,py));

player.style.left=px+"px";
player.style.top=py+"px";

}

function spawnBone(){
    
const dir = Math.floor(Math.random() * 4);
// 0=上 1=下 2=左 3=右

const bone=document.createElement("div");
bone.className="bone";

bone.innerHTML=`
<div class="boneHead left"></div>
<div class="boneBody"></div>
<div class="boneHead right"></div>
`;

const length = 60 + Math.random()*120;

if(dir<=1){

    bone.style.width=length+"px";
    bone.style.height="20px";

    bone.querySelector(".boneBody").style.width=(length-28)+"px";

}else{

    bone.style.width="20px";
    bone.style.height=length+"px";

    bone.style.flexDirection="column";

    const body=bone.querySelector(".boneBody");

    body.style.width="10px";
    body.style.height=(length-28)+"px";

}

switch(dir){

case 0:

    bone.x=Math.random()*(500-length);
    bone.y=-20;

    bone.vx=0;
    bone.vy=4;

    bone.angle = 0;
    bone.rotateSpeed = Math.random() * 6 + 2;

break;

case 1:

    bone.x=Math.random()*(500-length);
    bone.y=520;

    bone.vx=0;
    bone.vy=-4;

    bone.angle = 0;
    bone.rotateSpeed = Math.random() * 6 + 2;

break;

case 2:

    bone.x=-20;
    bone.y=Math.random()*(500-length);

    bone.vx=4;
    bone.vy=0;

    bone.angle = 0;
    bone.rotateSpeed = Math.random() * 6 + 2;

break;

case 3:

    bone.x=520;
    bone.y=Math.random()*(500-length);

    bone.vx=-4;
    bone.vy=0;

    bone.angle = 0;
    bone.rotateSpeed = Math.random() * 6 + 2;

break;

}

bone.style.left=bone.x+"px";
bone.style.top=bone.y+"px";

game.appendChild(bone);

bones.push(bone);

}

function updateBones(){

for(let i=bones.length-1;i>=0;i--){

const b=bones[i];

b.y+=b.vy;
b.x+=b.vx;

b.style.left=b.x+"px";
b.style.top=b.y+"px";

b.angle += b.rotateSpeed;

b.style.transform =
`rotate(${b.angle}deg)`;

if(hit(b)){
hp--;

document.getElementById("hp").textContent=hp;

game.removeChild(b);
bones.splice(i,1);

if(hp<=0){

playing=false;

alert("GAME OVER\n生存時間："+time+"秒");

}

continue;

}

if(
    b.x<-250 ||
    b.x>520 ||
    b.y<-250 ||
    b.y>520
){

    game.removeChild(b);
    bones.splice(i,1);

}

}

}

function hit(b){

    const bw = b.offsetWidth;
    const bh = b.offsetHeight;

    return (
        px + 24 > b.x &&
        px < b.x + bw &&
        py + 24 > b.y &&
        py < b.y + bh
    );

}

setInterval(()=>{

if(!playing)return;

updatePlayer();

updateBones();

},16);

setInterval(()=>{

if(!playing)return;

spawnBone();

},600);

setInterval(()=>{

if(!playing)return;

time++;

document.getElementById("time").textContent=time;

if(time >= 30){

    playing = false;

    alert("🎉 CLEAR!\n30秒生き残りました！");

}

},1000);

function restart(){

bones.forEach(b=>b.remove());

bones=[];

hp=5;

time=0;

px=240;
py=430;

playing=true;

document.getElementById("hp").textContent=hp;
document.getElementById("time").textContent=time;

player.style.display = "block";

}

restart();

</script>

</body>
</html>
