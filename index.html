<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キツネ紹介カード</title>
    <style>
        /* 全体のリセットと背景設定 */
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* コンテナ（中央配置用） */
        .container {
            padding: 20px;
        }

        /* カードのデザイン */
        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 24px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }

        /* タイトル */
        h1 {
            font-size: 22px;
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 20px;
        }

        /* 画像を表示するエリア */
        .image-container {
            width: 100%;
            height: 250px;
            border-radius: 12px;
            overflow: hidden;
            background-color: #eaeaea;
            margin-bottom: 20px;
        }

        /* キツネの画像（枠にきれいに収まるように設定） */
        .fox-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ボタンのデザイン */
        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px 0;
            background-color: #ff9500;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 12px rgba(255, 149, 0, 0.3);
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        /* ボタンにマウスを乗せたときの動き */
        .btn:hover {
            background-color: #e08400;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(255, 149, 0, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>🦊 今日のキツネ紹介</h1>
            
            <div class="image-container">
                <img id="foxImage" src="" alt="キツネの画像" class="fox-img">
            </div>
            
            <a id="foxLink" href="" target="_blank" class="btn">本家サイトで見つける</a>
        </div>
    </div>

    <script>
        // ご提示いただいたJSONデータ
        const foxData = {
            "image": "https://randomfox.ca/images/79.jpg",
            "link": "https://randomfox.ca/?i=79"
        };

        // HTMLのエレメント（要素）を取得して、データを反映させる
        document.getElementById('foxImage').src = foxData.image;
        document.getElementById('foxLink').href = foxData.link;
    </script>
</body>
</html>
