# application-dev.properties
# 開発用プロファイル(dev)。秘密情報は含めないこと（このファイルは Git 追跡対象）。
# H2 コンソールは SecurityConfig の h2ConsoleSecurityFilterChain と対で dev 限定。
# 起動例:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev            (Linux/Mac)
#   ./mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=dev"      (Windows)
# コンソール: http://localhost:8080/h2-console

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
