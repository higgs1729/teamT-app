<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Dog API - カードスタイル</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 { font-size: 1.8rem; color: #2d3748; margin-bottom: 24px; }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      overflow: hidden;
      width: 360px;
    }
    .card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      display: block;
    }
    .card-body {
      padding: 20px;
      text-align: center;
    }
    .card-body p {
      color: #718096;
      margin-bottom: 16px;
      font-size: 0.95rem;
    }
    button {
      background: #4a90e2;
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #357abd; }
    .loading { color: #a0aec0; font-style: italic; }
  </style>
</head>
<body>
  <h1>🐶 今日のワンコ</h1>
  <div class="card">
    <img id="dog-img" src="" alt="犬の画像">
    <div class="card-body">
      <p id="status-text" class="loading">読み込み中...</p>
      <button onclick="fetchDog()">次のワンコを見る</button>
    </div>
  </div>

  <script>
    async function fetchDog() {
      const img = document.getElementById('dog-img');
      const status = document.getElementById('status-text');
      status.textContent = '読み込み中...';
      img.style.opacity = '0.4';

      const res = await fetch('https://dog.ceo/api/breeds/image/random');
      const data = await res.json();

      img.onload = () => {
        img.style.opacity = '1';
        status.textContent = '新しいワンコが登場しました！';
      };
      img.src = data.message;
    }

    fetchDog();
  </script>
</body>
</html>
