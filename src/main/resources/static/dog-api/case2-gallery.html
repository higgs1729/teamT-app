<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Dog API - ギャラリースタイル</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      padding: 32px 20px;
    }
    header {
      text-align: center;
      margin-bottom: 32px;
    }
    header h1 { font-size: 2rem; letter-spacing: 2px; color: #e2b96f; }
    header p { color: #888; margin-top: 6px; }
    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    button {
      padding: 10px 24px;
      border-radius: 6px;
      border: none;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.8; }
    #btn-add { background: #e2b96f; color: #1a1a2e; font-weight: bold; }
    #btn-clear { background: #444; color: #eee; }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .gallery-item {
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 1;
      background: #2a2a3e;
    }
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s;
    }
    .gallery-item:hover img { transform: scale(1.05); }
    #empty-msg {
      text-align: center;
      color: #555;
      margin-top: 60px;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>🐾 DOG GALLERY</h1>
    <p>ボタンを押してワンコを追加しよう</p>
  </header>
  <div class="controls">
    <button id="btn-add" onclick="addDog()">+ ワンコを追加</button>
    <button id="btn-clear" onclick="clearGallery()">クリア</button>
  </div>
  <div class="gallery" id="gallery"></div>
  <p id="empty-msg">まだ画像がありません。「ワンコを追加」を押してみて！</p>

  <script>
    async function addDog() {
      const res = await fetch('https://dog.ceo/api/breeds/image/random');
      const data = await res.json();

      const item = document.createElement('div');
      item.className = 'gallery-item';
      const img = document.createElement('img');
      img.src = data.message;
      img.alt = '犬の画像';
      item.appendChild(img);

      document.getElementById('gallery').prepend(item);
      document.getElementById('empty-msg').style.display = 'none';
    }

    function clearGallery() {
      document.getElementById('gallery').innerHTML = '';
      document.getElementById('empty-msg').style.display = 'block';
    }
  </script>
</body>
</html>
