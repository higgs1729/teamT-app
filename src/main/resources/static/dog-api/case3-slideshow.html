<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Dog API - スライドショースタイル</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #fdf6ec;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    h1 { font-size: 1.6rem; color: #5a3e2b; margin-bottom: 20px; }
    .slideshow {
      position: relative;
      width: 480px;
      height: 340px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      background: #ddd;
    }
    .slideshow img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0; left: 0;
      transition: opacity 0.6s ease;
    }
    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.75);
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 1.3rem;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .arrow:hover { background: rgba(255,255,255,0.95); }
    #btn-prev { left: 12px; }
    #btn-next { right: 12px; }
    .counter {
      margin-top: 14px;
      color: #888;
      font-size: 0.9rem;
    }
    .auto-label {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #5a3e2b;
      font-size: 0.9rem;
    }
    input[type=checkbox] { cursor: pointer; width: 16px; height: 16px; }
  </style>
</head>
<body>
  <h1>🐕 わんこスライドショー</h1>
  <div class="slideshow">
    <img id="slide-img" src="" alt="犬の画像">
    <button class="arrow" id="btn-prev" onclick="go(-1)">&#8249;</button>
    <button class="arrow" id="btn-next" onclick="go(1)">&#8250;</button>
  </div>
  <p class="counter" id="counter">- / -</p>
  <label class="auto-label">
    <input type="checkbox" id="auto-play" onchange="toggleAuto()"> 自動再生（3秒）
  </label>

  <script>
    const history = [];
    let current = -1;
    let timer = null;

    async function fetchNew() {
      const res = await fetch('https://dog.ceo/api/breeds/image/random');
      const data = await res.json();
      return data.message;
    }

    async function go(dir) {
      if (dir === 1) {
        if (current < history.length - 1) {
          current++;
        } else {
          const url = await fetchNew();
          history.push(url);
          current = history.length - 1;
        }
      } else {
        if (current > 0) current--;
      }
      show();
    }

    function show() {
      const img = document.getElementById('slide-img');
      img.style.opacity = '0';
      img.onload = () => { img.style.opacity = '1'; };
      img.src = history[current];
      document.getElementById('counter').textContent = `${current + 1} / ${history.length}`;
    }

    function toggleAuto() {
      if (document.getElementById('auto-play').checked) {
        timer = setInterval(() => go(1), 3000);
      } else {
        clearInterval(timer);
      }
    }

    go(1);
  </script>
</body>
</html>
