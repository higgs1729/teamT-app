<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規登録 - teamT-app</title>
    <link rel="stylesheet" th:href="@{/css/auth/auth.css}">
</head>
<body class="auth-page">
<main class="auth-shell">
    <section class="auth-panel" aria-labelledby="register-title">
        <h1 id="register-title">新規登録</h1>

        <form th:action="@{/auth/register}" th:object="${registerRequest}" method="post" class="auth-form">
            <label>
                名前
                <input type="text" th:field="*{name}" autocomplete="name" required>
                <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            </label>
            <label>
                メールアドレス
                <input type="email" th:field="*{email}" autocomplete="email" required>
                <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </label>
            <label>
                パスワード
                <input type="password" th:field="*{password}" autocomplete="new-password" required>
                <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </label>
            <button type="submit">登録する</button>
        </form>

        <p class="auth-link">登録済みの場合は <a th:href="@{/auth/login}">ログイン</a></p>
    </section>
</main>
</body>
</html>
