<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ランダム犬画像</title>
</head>
<body>

    <h1>犬の画像表示</h1>

    <button onclick="showDogImage()">犬の画像を表示</button>

    <br><br>

    <img id="dogImage" width="400" alt="犬の画像">

    <script>
        async function showDogImage() {
            try {
                // APIからデータ取得
                const response = await fetch(
                    "https://dog.ceo/api/breeds/image/random"
                );

                const data = await response.json();

                // 取得した画像URLをimgタグに設定
                document.getElementById("dogImage").src = data.message;

            } catch (error) {
                console.error("画像取得失敗:", error);
            }
        }
    </script>

</body>
</html>
