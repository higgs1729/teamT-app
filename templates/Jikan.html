<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ランダムアニメ表示</title>
</head>
<body>

<h1 id="title">読み込み中...</h1>
<img id="anime" width="300">

<script>
fetch("https://api.jikan.moe/v4/anime?q=anime")
    .then(response => response.json())
    .then(data => {

        // 検索結果の件数を取得
        const animeList = data.data;

        // ランダムな番号を生成
        const randomIndex = Math.floor(
            Math.random() * animeList.length
        );

        // ランダムなアニメを取得
        const randomAnime = animeList[randomIndex];

        // タイトル表示
        document.getElementById("title").textContent =
            randomAnime.title;

        // 画像表示
        document.getElementById("anime").src =
            randomAnime.images.jpg.image_url;
    });
</script>

</body>
</html>
