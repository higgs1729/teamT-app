<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Waifu画像表示</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        img {
            max-width: 500px;
            border-radius: 10px;
            margin-top: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>ランダムWaifu画像</h1>

    <button onclick="loadWaifu()">画像を取得</button>

    <div>
        <img id="waifuImage" src="" alt="Waifu画像">
    </div>

    <script>
        async function loadWaifu() {
            try {
                const response = await fetch("https://api.waifu.im/images");
                const data = await response.json();

                const imageUrl = data.items[0].url;
                document.getElementById("waifuImage").src = imageUrl;
            } catch (error) {
                console.error("エラー:", error);
                alert("画像の取得に失敗しました");
            }
        }

        // ページ読み込み時に1枚表示
        loadWaifu();
    </script>
</body>
</html>
