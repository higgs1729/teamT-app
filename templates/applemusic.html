<input type="text" id="keyword" placeholder="曲名を入力">
<button onclick="searchMusic()">検索</button>

<div id="results"></div>

<script>
async function searchMusic() {

    const keyword =
        document.getElementById("keyword").value;

    const response = await fetch(
        `https://itunes.apple.com/search?term=${encodeURIComponent(keyword)}&entity=song&limit=10`
    );

    const data = await response.json();

    const results =
        document.getElementById("results");

    results.innerHTML = "";

    data.results.forEach(song => {
        results.innerHTML += `
            <div style="margin:10px;padding:10px;border:1px solid #ddd">
                <img src="${song.artworkUrl100}">
                <h3>${song.trackName}</h3>
                <p>${song.artistName}</p>
                <audio controls src="${song.previewUrl}"></audio>
            </div>
        `;
    });
}
</script>
