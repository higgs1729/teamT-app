<!DOCTYPE html>
<!--
  Changelogs.md API紹介ページ
  目的: OSS changelog検索サービスを使い、パッケージの更新履歴探索を試す。
  構成: 検索語入力 / HTML検索結果取得 / フォールバックカード。
-->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Changelogs.md Search</title>
  <style>
    :root{--bg:#f4f6f4;--panel:#fff;--ink:#202522;--muted:#66736b;--line:#dde5df;--accent:#1f8a70;--soft:#e8f6f2;--danger:#c43d3d}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"BIZ UDPGothic","Meiryo UI",sans-serif;background:linear-gradient(135deg,#f4f6f4,#eef7ff);color:var(--ink)}
    main{width:min(980px,100%);margin:auto;padding:32px 18px}h1{margin:0 0 8px;font-size:clamp(24px,4vw,38px);letter-spacing:0}p{margin:0;color:var(--muted);line-height:1.7}a{color:var(--accent)}
    .panel{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:0 14px 30px rgba(40,70,58,.08);margin-top:16px}
    .row{display:flex;gap:10px;margin-top:16px}input,button{font:inherit;border-radius:10px;padding:11px 12px}input{flex:1;border:1px solid var(--line)}button{border:0;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
    .status{font-weight:700;color:var(--muted);margin:16px 0 10px}.status.error{color:var(--danger)}.result{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
    .card{padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff}.card b{display:block;margin-bottom:8px}.chip{display:inline-flex;margin-top:10px;padding:5px 8px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:12px;font-weight:700}
    @media(max-width:720px){.row{display:grid}}
  </style>
</head>
<body>
<main>
  <h1>Changelogs.md Search</h1>
  <p>GitHub上のchangelogをクロールして検索できるサービスです。HTML検索結果を取得し、更新履歴探索の入口として使います。</p>
  <section class="panel">
    <form class="row" id="form"><input id="q" value="react" autocomplete="off" aria-label="検索語"><button>検索</button></form>
    <p class="status" id="status">未検索です。</p>
    <div class="result" id="result"></div>
    <p style="margin-top:14px;font-size:12px;">Docs: <a href="https://changelogs.md" target="_blank" rel="noreferrer">https://changelogs.md</a></p>
  </section>
</main>
<script>
const form=document.getElementById("form"),q=document.getElementById("q"),statusEl=document.getElementById("status"),result=document.getElementById("result");
function fallback(msg){result.innerHTML=[`<article class="card"><b>検索サービス</b><p>${msg}</p><span class="chip">fallback</span></article>`,`<article class="card"><b>使いどころ</b><p>OSSライブラリのリリースノートや変更履歴を探す入口になります。</p><span class="chip">changelog</span></article>`].join("")}
form.addEventListener("submit",async e=>{e.preventDefault();statusEl.className="status";statusEl.textContent="検索中...";result.innerHTML="";try{const r=await fetch(`https://changelogs.md/?q=${encodeURIComponent(q.value)}`);if(!r.ok)throw new Error(`HTTP ${r.status}`);const html=await r.text();const matches=[...html.matchAll(/<a[^>]+href="([^"]+)"[^>]*>(.*?)<\/a>/g)].slice(0,8);statusEl.textContent=`成功: HTMLから${matches.length}件を抽出`;result.innerHTML=matches.map(m=>`<article class="card"><b>${m[2].replace(/<[^>]+>/g,"")||"Result"}</b><p>${m[1]}</p><span class="chip">result</span></article>`).join("")||"";if(!matches.length)fallback("検索結果リンクを抽出できませんでした。");}catch(err){statusEl.className="status error";statusEl.textContent="取得に失敗しました。";fallback(err.message);}});
</script>
</body>
</html>
