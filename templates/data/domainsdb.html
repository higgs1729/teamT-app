<!DOCTYPE html>
<!-- DomainDb Info紹介ページ: キーワードを含むドメイン名検索APIを試す。 -->
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>DomainDb Search</title><style>
:root{--bg:#f6f7fb;--panel:#fff;--ink:#202536;--muted:#667086;--line:#dde5ef;--accent:#1f8a70;--soft:#e8f6f2;--danger:#c43d3d}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"BIZ UDPGothic","Meiryo UI",sans-serif;background:linear-gradient(135deg,#f6f7fb,#eef8f4);color:var(--ink)}main{width:min(1000px,100%);margin:auto;padding:32px 18px}h1{margin:0 0 8px;font-size:clamp(24px,4vw,38px);letter-spacing:0}p{margin:0;color:var(--muted);line-height:1.7}a{color:var(--accent)}form{display:flex;gap:10px;margin:18px 0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}input,button{font:inherit;border-radius:10px;padding:11px 12px}input{flex:1;border:1px solid var(--line)}button{border:0;background:var(--accent);color:#fff;font-weight:700}.status{font-weight:700;color:var(--muted);margin-bottom:12px}.status.error{color:var(--danger)}.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.item{padding:14px;background:#fff;border:1px solid var(--line);border-radius:12px}.item b{display:block;word-break:break-all}@media(max-width:720px){form{display:grid}}
</style></head><body><main><h1>DomainDb Search</h1><p>文字列を含むドメイン候補を検索できるAPIです。ブランド名やキーワード調査のサンプルとして使えます。</p><form id="form"><input id="q" value="example" autocomplete="off"><button>検索</button></form><p class="status" id="status">未検索です。</p><section class="list" id="list"></section><p style="margin-top:14px;font-size:12px">Docs: <a href="https://api.domainsdb.info/" target="_blank" rel="noreferrer">https://api.domainsdb.info/</a></p></main><script>
document.getElementById("form").addEventListener("submit",async e=>{e.preventDefault();const q=document.getElementById("q").value,status=document.getElementById("status"),list=document.getElementById("list");status.className="status";status.textContent="検索中...";try{const r=await fetch(`https://api.domainsdb.info/v1/domains/search?domain=${encodeURIComponent(q)}&zone=com`);if(!r.ok)throw new Error(`HTTP ${r.status}`);const d=await r.json();status.textContent=`成功: ${d.total||0}件`;list.innerHTML=(d.domains||[]).slice(0,20).map(x=>`<article class="item"><b>${x.domain}</b><p>${x.create_date||""}</p></article>`).join("")}catch(err){status.className="status error";status.textContent="取得に失敗しました。";list.innerHTML=`<article class="item"><b>${q}.com</b><p>fallback: ${err.message}</p></article>`}})</script></body></html>
