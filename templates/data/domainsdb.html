<!DOCTYPE html>
<!-- DomainDb Info紹介ページ: キーワードを含むドメイン名検索APIを試す。 -->
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>DomainDb Search</title><style>
:root{--bg:#f6f7fb;--panel:#fff;--ink:#202536;--muted:#667086;--line:#dde5ef;--accent:#1f8a70;--soft:#e8f6f2;--danger:#c43d3d}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"BIZ UDPGothic","Meiryo UI",sans-serif;background:linear-gradient(135deg,#f6f7fb,#eef8f4);color:var(--ink)}main{width:min(1000px,100%);margin:auto;padding:32px 18px}h1{margin:0 0 8px;font-size:clamp(24px,4vw,38px);letter-spacing:0}p{margin:0;color:var(--muted);line-height:1.7}a{color:var(--accent)}form{display:flex;gap:10px;margin:18px 0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}input,button{font:inherit;border-radius:10px;padding:11px 12px}input{flex:1;border:1px solid var(--line)}button{border:0;background:var(--accent);color:#fff;font-weight:700}.status{font-weight:700;color:var(--muted);margin-bottom:12px}.status.error{color:var(--danger)}.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.item{padding:14px;background:#fff;border:1px solid var(--line);border-radius:12px}.item b{display:block;word-break:break-all}@media(max-width:720px){form{display:grid}}
</style></head><body><main><h1>DomainDb Search</h1><p>文字列を含むドメイン候補を検索できるAPIです。ブランド名やキーワード調査のサンプルとして使えます。</p><form id="form"><input id="q" value="example" autocomplete="off"><button>検索</button></form><p class="status" id="status">未検索です。</p><section class="list" id="list"></section><p style="margin-top:14px;font-size:12px">Docs: <a href="https://api.domainsdb.info/" target="_blank" rel="noreferrer">https://api.domainsdb.info/</a></p></main><script>
document.getElementById("form").addEventListener("submit",async e=>{e.preventDefault();const q=document.getElementById("q").value,status=document.getElementById("status"),list=document.getElementById("list");status.className="status";status.textContent="検索中...";try{const r=await fetch(`https://api.domainsdb.info/v1/domains/search?domain=${encodeURIComponent(q)}&zone=com`);if(!r.ok)throw new Error(`HTTP ${r.status}`);const d=await r.json();status.textContent=`成功: ${d.total||0}件`;list.innerHTML=(d.domains||[]).slice(0,20).map(x=>`<article class="item"><b>${x.domain}</b><p>${x.create_date||""}</p></article>`).join("")}catch(err){status.className="status error";status.textContent="取得に失敗しました。";list.innerHTML=`<article class="item"><b>${q}.com</b><p>fallback: ${err.message}</p></article>`}})</script></body></html>
<!DOCTYPE html>
<!--
  DomainsDB Search
  目的: 登録済みドメイン名を検索するDomainsDB APIの紹介ページ。
  構成: キーワード検索 / 取得結果一覧 / CORS失敗時のサンプル表示。
-->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DomainsDB Search</title>
  <style>
    :root{--ink:#172033;--muted:#667085;--panel:#fff;--line:#d7e3ef;--accent:#0f766e;--soft:#eefaf7}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Segoe UI",Meiryo,sans-serif;color:var(--ink);background:linear-gradient(135deg,#eefaf7,#f7fbff)}
    main{width:min(1080px,calc(100% - 28px));margin:auto;padding:28px 0 42px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px;box-shadow:0 14px 34px rgba(18,77,73,.08)}.layout{display:grid;grid-template-columns:.9fr 1.1fr;gap:16px}.tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--accent)}h1{font-size:clamp(28px,4vw,44px);line-height:1.08;margin:10px 0}.lead,.status{color:var(--muted);line-height:1.75}.form{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:16px}input,button{min-height:44px;border-radius:8px;font:inherit}input{border:1px solid var(--line);padding:0 12px}button{border:0;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}.grid{display:grid;gap:10px}.card{border:1px solid var(--line);border-radius:8px;background:var(--soft);padding:14px}.card small{display:block;color:var(--muted);margin-bottom:6px}.card strong{font-size:18px}.link{color:var(--accent);font-weight:700;text-decoration:none}@media(max-width:840px){.layout,.form{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="layout">
    <section class="panel">
      <div class="tag">domainsdb.info</div>
      <h1>登録済みドメイン名をキーワード検索</h1>
      <p class="lead">DomainsDB は登録済みドメイン名を検索できるAPIです。キーワードを入力して公開APIへの取得を試し、失敗時はサンプル結果を表示します。</p>
      <div class="form">
        <input id="query" value="openai" aria-label="domain keyword">
        <button id="loadBtn" type="button">検索</button>
      </div>
      <p id="status" class="status">検索語を入れて取得してください。</p>
      <a class="link" href="https://domainsdb.info/" target="_blank" rel="noreferrer">公式ページ</a>
    </section>
    <section class="panel"><div id="results" class="grid"></div></section>
  </main>
  <script>
    const sample = [{domain:"openai.com", create_date:"2007-01-19", update_date:"2025-03-01", country:"US"}, {domain:"openai.org", create_date:"2015-06-25", update_date:"2025-02-14", country:"US"}];
    function render(items, fallback){
      document.getElementById("status").textContent = fallback ? "ライブ取得できなかったためサンプルを表示しています。" : `${items.length}件を表示しています。`;
      document.getElementById("results").innerHTML = items.map((item)=>`<article class="card"><small>${item.country || "domain"}</small><strong>${item.domain || item.name || "-"}</strong><p class="status">created: ${item.create_date || "-"} / updated: ${item.update_date || "-"}</p></article>`).join("");
    }
    async function searchDomains(){
      const query = document.getElementById("query").value.trim() || "openai";
      document.getElementById("status").textContent = "loading...";
      try{
        const res = await fetch(`https://api.domainsdb.info/v1/domains/search?domain=${encodeURIComponent(query)}`, {cache:"no-store"});
        if(!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        const items = (json.domains || []).slice(0, 12);
        if(!items.length) throw new Error("empty");
        render(items, false);
      }catch(error){
        console.warn(error);
        render(sample, true);
      }
    }
    document.getElementById("loadBtn").addEventListener("click", searchDomains);
    render(sample, false);
  </script>
</body>
</html>
