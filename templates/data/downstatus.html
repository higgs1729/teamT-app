<!DOCTYPE html>
<!-- DownStatus紹介ページ: 外部サービス稼働状況API候補を紹介し、主要サービスの状態確認UIを提供する。 -->
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>DownStatus Monitor</title><style>
:root{--bg:#f6f7fb;--panel:#fff;--ink:#202536;--muted:#667086;--line:#dde5ef;--accent:#d64545;--soft:#fff0f0}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"BIZ UDPGothic","Meiryo UI",sans-serif;background:linear-gradient(135deg,#f6f7fb,#fff0f0);color:var(--ink)}main{width:min(980px,100%);margin:auto;padding:32px 18px}h1{margin:0 0 8px;font-size:clamp(24px,4vw,38px);letter-spacing:0}p{margin:0;color:var(--muted);line-height:1.7}a{color:var(--accent)}.panel{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:0 14px 30px rgba(90,50,50,.08)}select,button{width:100%;font:inherit;border-radius:10px;padding:11px 12px;margin-top:10px}select{border:1px solid var(--line)}button{border:0;background:var(--accent);color:#fff;font-weight:700}.result{margin-top:16px;padding:18px;border-radius:14px;background:var(--soft);min-height:140px}.result b{font-size:24px}
</style></head><body><main><h1>DownStatus Monitor</h1><p>GitHub、AWS、Discordなどの外部サービス状態を確認するAPI候補です。API仕様が変動しやすいため、フォールバック込みで状態確認UIを用意しています。</p><section class="panel"><select id="service"><option>github</option><option>aws</option><option>discord</option><option>digitalocean</option></select><button id="check">状態を確認</button><div class="result" id="result">サービスを選んでください。</div><p style="margin-top:14px;font-size:12px">Docs: <a href="https://isitdownstatus.com" target="_blank" rel="noreferrer">https://isitdownstatus.com</a></p></section></main><script>
document.getElementById("check").addEventListener("click",async()=>{const service=document.getElementById("service").value,result=document.getElementById("result");result.textContent="確認中...";try{const r=await fetch(`https://isitdownstatus.com/api/v1/${encodeURIComponent(service)}`);if(!r.ok)throw new Error(`HTTP ${r.status}`);const d=await r.json();result.innerHTML=`<b>${service}</b><p>${JSON.stringify(d,null,2)}</p>`}catch(e){result.innerHTML=`<b>${service}</b><p>公開API取得不可のため、公式サイトで確認してください。</p><p>理由: ${e.message}</p>`}});
</script></body></html>
