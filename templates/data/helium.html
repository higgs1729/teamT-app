<!DOCTYPE html>
<!--
  Helium Network API Console
  目的: Helium のブロックチェーン/ネットワークAPI候補を紹介し、ホットスポット情報の取得イメージを表示する。
  構成: APIキー入力 / エンドポイント選択 / フェッチ結果 / サンプルフォールバック。
-->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Helium Network API Console</title>
  <style>
    :root{--ink:#172033;--muted:#667085;--panel:#fff;--line:#d9e2f0;--accent:#5b3fd6;--ok:#0f766e}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Segoe UI",Meiryo,sans-serif;color:var(--ink);background:linear-gradient(135deg,#f5f4ff,#edfdf7)}
    main{width:min(1100px,calc(100% - 28px));margin:auto;padding:28px 0 42px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px;box-shadow:0 14px 34px rgba(38,44,72,.08)}.layout{display:grid;grid-template-columns:.9fr 1.1fr;gap:16px}h1{font-size:clamp(28px,4vw,44px);line-height:1.08;margin:10px 0}.tag{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.lead,.status{color:var(--muted);line-height:1.75}.form{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin-top:16px}input,select,button{min-height:44px;border-radius:8px;font:inherit}input,select{border:1px solid var(--line);padding:0 12px;background:#fff}button{border:0;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}.cards{display:grid;gap:10px}.card{border:1px solid var(--line);border-radius:8px;padding:14px;background:#fbfcff}.card small{display:block;color:var(--ok);font-weight:700;margin-bottom:6px}.card pre{white-space:pre-wrap;margin:0;color:#344054;line-height:1.55}.link{color:var(--accent);font-weight:700;text-decoration:none}@media(max-width:880px){.layout,.form{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="layout">
    <section class="panel">
      <div class="tag">helium network</div>
      <h1>分散型ワイヤレスネットワークの情報を眺める</h1>
      <p class="lead">Helium はIoT/Mobile向けの分散型ネットワークです。公式APIの構成は変更される可能性があるため、このページでは入力したURLへ接続を試し、失敗時はホットスポット情報のサンプルを表示します。</p>
      <div class="form">
        <input id="endpoint" value="https://api.helium.io/v1/hotspots" aria-label="Endpoint URL">
        <input id="apiKey" placeholder="APIキーが必要な場合のみ入力" aria-label="API key">
        <button id="loadBtn" type="button">取得</button>
      </div>
      <p id="status" class="status">APIキーは保存しません。CORSや認証で失敗した場合はサンプル表示に切り替わります。</p>
      <a class="link" href="https://docs.helium.com/api/blockchain/introduction/" target="_blank" rel="noreferrer">公式Docs</a>
    </section>
    <section class="panel"><div id="cards" class="cards"></div></section>
  </main>
  <script>
    const sample = [
      {label:"network", data:{name:"Helium", focus:"IoT / Mobile coverage", token:"HNT"}},
      {label:"hotspot sample", data:{status:"online", city:"Tokyo", reward_scale:"0.82", last_seen:"demo"}},
      {label:"api note", data:{auth:"may require key", cors:"browser access can vary", fallback:"enabled"}}
    ];
    function render(items, fallback){
      document.getElementById("status").textContent = fallback ? "ライブ取得できなかったためサンプルを表示しています。" : "ライブ取得に成功しました。";
      document.getElementById("cards").innerHTML = items.map((item)=>`<article class="card"><small>${item.label}</small><pre>${JSON.stringify(item.data, null, 2)}</pre></article>`).join("");
    }
    async function loadData(){
      const endpoint = document.getElementById("endpoint").value.trim();
      const key = document.getElementById("apiKey").value.trim();
      document.getElementById("status").textContent = "loading...";
      try{
        const headers = key ? {"Authorization":`Bearer ${key}`} : {};
        const res = await fetch(endpoint, {headers, cache:"no-store"});
        if(!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        render([{label:"response", data:json}], false);
      }catch(error){
        console.warn(error);
        render(sample, true);
      }
    }
    document.getElementById("loadBtn").addEventListener("click", loadData);
    render(sample, false);
  </script>
</body>
</html>
