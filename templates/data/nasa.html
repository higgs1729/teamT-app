<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>NASA API ランダム表示</title>

<style>
body{
background:#111827;
color:white;
text-align:center;
font-family:sans-serif;
padding:20px;
}

img, iframe{
max-width:90%;
border-radius:10px;
margin-top:20px;
}

#description{
max-width:1000px;
margin:20px auto;
line-height:1.8;
}
</style>
</head>
<body>

<h1>🚀 NASA API ランダム表示</h1>

<button onclick="loadNasaMedia()">
ランダム表示
</button>

<h2 id="title"></h2>

<div id="mediaArea"></div>

<p id="description"></p>

<script>

const apiKey = "eMHkZMERuSgINH2tnmhPBuoaITaItgb6SuGzHpxz";

async function loadNasaMedia(){

try{

// ★ランダム取得（ここが重要）
const response = await fetch(
     `https://api.nasa.gov/planetary/apod?api_key=${apiKey}&count=1`
);

const data = await response.json();
const item = data[0]; // count=1なので配列

console.log(item);

document.getElementById("title").textContent = item.title;
document.getElementById("description").textContent = item.explanation;

const mediaArea = document.getElementById("mediaArea");
mediaArea.innerHTML = "";

// 画像の場合
if(item.media_type === "image"){
     mediaArea.innerHTML = `
          <img src="${item.url}" alt="NASA画像">
     `;
}

// 動画の場合（YouTubeなど）
else if(item.media_type === "video"){
     mediaArea.innerHTML = `
          <iframe width="560" height="315"
               src="${item.url}"
               frameborder="0"
               allowfullscreen>
          </iframe>
     `;
}

}
catch(error){

console.error(error);

document.getElementById("title").textContent = "取得失敗";
document.getElementById("description").textContent = error.message;
}
}

</script>

</body>
</html>
