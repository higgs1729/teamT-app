<!DOCTYPE html>
<!--
  OpenVisionAPI
  目的: オープンソース画像認識APIの利用イメージを、画像URLと任意APIキー入力で確認する。
  構成: 概要、画像URL/APIキー入力、推論結果カード、サンプル表示。
-->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenVisionAPI</title>
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#d8e0ec;--accent:#4f46e5;--accent2:#22c55e}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Yu Gothic","Meiryo",sans-serif;color:var(--ink);background:linear-gradient(180deg,#fbfdff,var(--bg))}main{width:min(1100px,calc(100% - 28px));margin:auto;padding:28px 0}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-bottom:16px}.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 14px 30px rgba(15,23,42,.08)}.intro{padding:24px;border-top:5px solid var(--accent)}h1{margin:4px 0 10px;font-size:clamp(28px,4vw,40px);letter-spacing:0}.eyebrow{margin:0;color:var(--accent);font-weight:700}.meta{display:grid;gap:10px;padding:16px}.meta div{padding:12px;border:1px solid var(--line);border-radius:8px;background:#fbfdff}.meta strong{display:block;color:var(--muted);font-size:12px}.meta a{color:var(--accent);overflow-wrap:anywhere}.controls{padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label span{display:block;margin-bottom:6px;font-weight:700}input{width:100%;height:42px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit}.wide{grid-column:1/-1}.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}button{min-height:42px;border:0;border-radius:8px;padding:0 18px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}.secondary{background:#e2e8f0;color:#172033}.status{color:var(--muted)}.url{margin-top:12px;padding:12px;border-radius:8px;background:#111827;color:#d1fae5;font-family:Consolas,monospace;overflow-wrap:anywhere}.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.item{padding:16px;border-top:4px solid var(--accent2)}.item img{width:100%;max-height:220px;object-fit:cover;border-radius:8px;margin-bottom:10px}.item h2{margin:0 0 8px;font-size:19px}.item p{margin:0;color:var(--muted);line-height:1.7}.item pre{max-height:160px;overflow:auto;background:#f1f5f9;border-radius:8px;padding:10px;font-size:12px;white-space:pre-wrap}@media(max-width:760px){.hero,.grid{grid-template-columns:1fr}.wide{grid-column:auto}main{width:min(100% - 22px,1100px)}}
  </style>
</head>
<body>
<main>
  <section class="hero">
    <div class="panel intro"><p class="eyebrow">Machine Learning / Vision</p><h1>OpenVisionAPI</h1><p>画像URLを渡してコンピュータビジョンAPIを試すための紹介ページです。キーが必要な場合は入力欄から渡します。</p></div>
    <aside class="panel meta"><div><strong>公式URL</strong><a href="https://openvisionapi.com" target="_blank" rel="noreferrer">https://openvisionapi.com</a></div><div><strong>シークレット</strong>APIキーはブラウザ入力のみ。ファイルには保存しません。</div></aside>
  </section>
  <section class="panel controls">
    <div class="grid"><label class="wide"><span>API Endpoint</span><input id="endpoint" value="https://openvisionapi.com/api/analyze"></label><label><span>画像URL</span><input id="imageUrl" value="https://images.unsplash.com/photo-1515879218367-8466d910aaa4?w=800"></label><label><span>APIキー（任意）</span><input id="apiKey" type="password" placeholder="必要な場合だけ入力"></label></div>
    <div class="actions"><button id="loadBtn">解析する</button><button id="sampleBtn" class="secondary">サンプル表示</button><span id="status" class="status"></span></div>
    <div id="requestUrl" class="url"></div>
  </section>
  <section id="results" class="results" aria-live="polite"></section>
</main>
<script>
const sample={labels:["computer","code","workspace"],confidence:0.91,note:"API仕様変更やキー未入力時のサンプルです。"};
const $=id=>document.getElementById(id);function esc(v){return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(data,msg){$("status").textContent=msg;const img=$("imageUrl").value;$("results").innerHTML=`<article class="panel item"><img src="${esc(img)}" alt="解析対象画像"><h2>解析結果</h2><p>${esc((data.labels||data.tags||[]).join(", ")||data.note||"JSONを確認してください。")}</p><pre>${esc(JSON.stringify(data,null,2))}</pre></article>`}
async function loadData(){const url=$("endpoint").value.trim();$("requestUrl").textContent=url;$("status").textContent="解析中...";try{const headers={"Content-Type":"application/json"};const key=$("apiKey").value.trim();if(key){headers.Authorization="Bearer "+key;headers["x-api-key"]=key}const r=await fetch(url,{method:"POST",headers,body:JSON.stringify({image_url:$("imageUrl").value.trim()})});if(!r.ok)throw new Error("HTTP "+r.status);render(await r.json(),"取得しました");}catch(e){render(sample,"取得できないためサンプルを表示しています: "+e.message)}}
$("loadBtn").addEventListener("click",loadData);$("sampleBtn").addEventListener("click",()=>render(sample,"サンプル表示"));render(sample,"サンプル表示");$("requestUrl").textContent=$("endpoint").value;
</script>
</body>
</html>
