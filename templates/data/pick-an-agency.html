<!DOCTYPE html>
<!--
  Pick an Agency Search
  目的: マーケティング代理店検索API候補を、キー入力式の検索UIで紹介する。
  構成: サービス/地域/キー入力 / 取得試行 / 代理店カード表示。
-->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pick an Agency Search</title>
  <style>
    :root{--ink:#172033;--muted:#667085;--panel:#fff;--line:#dde5ef;--accent:#2563eb;--soft:#f6f9ff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Segoe UI",Meiryo,sans-serif;color:var(--ink);background:linear-gradient(135deg,#eff6ff,#f8fafc)}
    main{width:min(1100px,calc(100% - 28px));margin:auto;padding:28px 0 42px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px;box-shadow:0 14px 34px rgba(28,65,132,.08)}.layout{display:grid;grid-template-columns:.95fr 1.05fr;gap:16px}.tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--accent)}h1{font-size:clamp(28px,4vw,44px);line-height:1.08;margin:10px 0}.lead,.status{color:var(--muted);line-height:1.75}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}input,button{min-height:44px;border-radius:8px;font:inherit}input{border:1px solid var(--line);padding:0 12px}button{border:0;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;grid-column:1/-1}.grid{display:grid;gap:10px}.card{border:1px solid var(--line);border-radius:8px;background:var(--soft);padding:14px}.card small{display:block;color:var(--muted);margin-bottom:6px}.card strong{font-size:18px}.link{color:var(--accent);font-weight:700;text-decoration:none}@media(max-width:840px){.layout,.form{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="layout">
    <section class="panel">
      <div class="tag">pick an agency</div>
      <h1>サービスと地域でマーケティング代理店を探す</h1>
      <p class="lead">Pick an Agency は多数のマーケティング代理店をサービス、地域、評価で検索するAPI候補です。APIキーが必要な想定のため、入力欄からのみ利用します。</p>
      <div class="form">
        <input id="service" value="seo" aria-label="service">
        <input id="location" value="London" aria-label="location">
        <input id="endpoint" value="https://www.pickanagency.com/api/agencies" aria-label="endpoint">
        <input id="key" type="password" placeholder="API key" aria-label="API key">
        <button id="loadBtn" type="button">代理店を検索</button>
      </div>
      <p id="status" class="status">取得できない場合はサンプル表示に切り替わります。</p>
      <a class="link" href="https://www.pickanagency.com/developers" target="_blank" rel="noreferrer">公式ページ</a>
    </section>
    <section class="panel"><div id="results" class="grid"></div></section>
  </main>
  <script>
    const sample = [{name:"North Star Digital", location:"London", services:["SEO","PPC"], rating:"4.8"}, {name:"Bright Growth Studio", location:"Manchester", services:["Branding","Content"], rating:"4.6"}];
    function render(items, fallback){
      document.getElementById("status").textContent = fallback ? "ライブ取得できなかったためサンプルを表示しています。" : `${items.length}件を表示しています。`;
      document.getElementById("results").innerHTML = items.map((item)=>`<article class="card"><small>${item.location || "-"}</small><strong>${item.name || item.agency || "-"}</strong><p class="status">services: ${(item.services || []).join(", ") || "-"}<br>rating: ${item.rating || "-"}</p></article>`).join("");
    }
    async function loadAgencies(){
      const endpoint = document.getElementById("endpoint").value.trim();
      const params = new URLSearchParams({service:document.getElementById("service").value.trim(), location:document.getElementById("location").value.trim()});
      const key = document.getElementById("key").value.trim();
      document.getElementById("status").textContent = "loading...";
      try{
        if(!key) throw new Error("missing api key");
        const res = await fetch(`${endpoint}?${params}`, {headers:{"Authorization":`Bearer ${key}`}, cache:"no-store"});
        if(!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        const items = (json.data || json.agencies || []).slice(0, 10);
        if(!items.length) throw new Error("empty");
        render(items, false);
      }catch(error){
        console.warn(error);
        render(sample, true);
      }
    }
    document.getElementById("loadBtn").addEventListener("click", loadAgencies);
    render(sample, false);
  </script>
</body>
</html>
