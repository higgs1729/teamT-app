<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCP Foundation - Restricted Database Terminal</title>
    <style>
        /* 財団ターミナル風のダーク＆サイバーデザイン */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Courier New', Courier, monospace; /* 端末風フォント */
            background-color: #0c0d0e;
            color: #39ff14; /* 警告ネオングリーン */
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            border: 2px solid #39ff14;
            padding: 30px;
            background-color: #111411;
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.2);
        }
        header {
            text-align: center;
            border-bottom: 2px dashed #39ff14;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        header h1 {
            font-size: 2rem;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
        }
        .warning-text {
            color: #ff3333;
            font-weight: bold;
            animation: blink 2s infinite;
            margin-top: 10px;
            font-size: 0.9rem;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        input, button {
            background-color: #000;
            border: 1px solid #39ff14;
            color: #39ff14;
            padding: 10px 15px;
            font-family: inherit;
            font-size: 1rem;
        }
        input:focus, button:focus {
            outline: none;
            background-color: #1a241a;
            box-shadow: 0 0 8px rgba(57, 255, 20, 0.8);
        }
        button {
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        button:hover {
            background-color: #39ff14;
            color: #000;
        }
        .status-message {
            text-align: center;
            margin-bottom: 20px;
            font-style: italic;
        }
        /* SCPデータ表示エリア */
        .scp-article {
            border: 1px solid #39ff14;
            background-color: #050705;
            padding: 25px;
            display: none;
        }
        .scp-header {
            border-bottom: 1px solid #39ff14;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .item-number {
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff;
        }
        .object-class {
            display: inline-block;
            background-color: #ff3333;
            color: #000;
            padding: 2px 8px;
            font-weight: bold;
            margin-top: 5px;
            font-size: 0.9rem;
        }
        .object-class.safe { background-color: #39ff14; }
        .object-class.euclid { background-color: #ffcc00; }
        .object-class.keter { background-color: #ff3333; }
        
        .scp-section {
            margin-bottom: 20px;
        }
        .scp-section h3 {
            color: #fff;
            border-left: 4px solid #39ff14;
            padding-left: 10px;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }
        .scp-image-container {
            text-align: center;
            margin: 20px 0;
            border: 1px dashed #39ff14;
            padding: 10px;
            background: #000;
        }
        .scp-image-container img {
            max-width: 100%;
            height: auto;
            filter: grayscale(100%) contrast(120%); /* 監視カメラ・報告書風加工 */
        }
        .source-link {
            display: block;
            text-align: right;
            color: #888;
            text-decoration: none;
            font-size: 0.85rem;
            margin-top: 20px;
        }
        .source-link:hover {
            text-decoration: underline;
            color: #39ff14;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>SCP FOUNDATION TERMINAL</h1>
            <p>確保、収容、保護 — 財団機密データベース</p>
            <div class="warning-text">⚠️ 警告: 認可なきアクセスの追跡、および拘留を行います</div>
        </header>

        <div class="controls">
            <input type="number" id="scpNumber" placeholder="番号入力 (例: 173, 682, 096)" value="173" min="1">
            <button id="fetchBtn">アクセス承認</button>
            <button id="randomBtn">ランダム抽出</button>
        </div>

        <div id="status" class="status-message">端末スタンバイ。アクセスするオブジェクト番号を入力してください...</div>

        <article id="scpArticle" class="scp-article">
            <div class="scp-header">
                <div id="scpTitle" class="item-number">項目: SCP-XXXX</div>
                <div id="scpClass" class="object-class">オブジェクトクラス: 未分類</div>
            </div>

            <div id="scpImageArea" class="scp-image-container" style="display: none;">
                <img id="scpImage" src="" alt="Anomalous Image">
            </div>

            <div class="scp-section">
                <h3>[特別収容プロトコル]</h3>
                <p id="scpProcedures">データを復号中...</p>
            </div>

            <div class="scp-section">
                <h3>[説明]</h3>
                <p id="scpDescription">データを復号中...</p>
            </div>

            <a id="scpLink" href="#" target="_blank" class="source-link">>> 本家Wikidotの報告書を閲覧</a>
        </article>
    </div>

    <script>
        const fetchBtn = document.getElementById('fetchBtn');
        const randomBtn = document.getElementById('randomBtn');
        const scpNumberInput = document.getElementById('scpNumber');
        const statusDiv = document.getElementById('status');
        const scpArticle = document.getElementById('scpArticle');

        // scp-api プロジェクトのデータ構造を利用
        const BASE_DATA_URL = 'https://scp-data.tedivm.com/data/scp/items/';

        async function loadSCP(number) {
            // 3桁のゼロ埋め（例: 87 -> 087）
            const formattedNumber = String(number).padStart(3, '0');
            const scpId = `scp-${number}`; // APIのキー名形式

            statusDiv.innerHTML = `リクエスト送信中... [SCP-${formattedNumber}]`;
            scpArticle.style.display = 'none';

            try {
                // まずはインデックスファイルからメタデータを取得
                const response = await fetch(`${BASE_DATA_URL}index.json`);
                if (!response.ok) throw new Error('データベースの応答がありません');
                const indexData = await response.json();

                // 該当のSCPがあるかチェック
                const meta = indexData[scpId];
                if (!meta) {
                    throw new Error(`対象のオブジェクト [SCP-${formattedNumber}] はデータベース内に存在しないか、未収容です。`);
                }

                // 本文データ（生テキストファイル）を取得
                const contentResponse = await fetch(`https://scp-data.tedivm.com/data/scp/${meta.content_file}`);
                if (!contentResponse.ok) throw new Error('報告書本文の復号に失敗しました');
                const contentData = await contentResponse.json();

                // テキストの取得
                const rawText = contentData.raw_content || "";
                
                // オブジェクトクラスの判定
                let objClass = "Unknown";
                const tags = meta.tags || [];
                if (tags.includes("safe")) objClass = "Safe";
                else if (tags.includes("euclid")) objClass = "Euclid";
                else if (tags.includes("keter")) objClass = "Keter";
                else if (tags.includes("thaumiel")) objClass = "Thaumiel";

                // 特別収容プロトコルと説明文をパース
                const procedures = parseSection(rawText, "Special Containment Procedures", "Description");
                const description = parseSection(rawText, "Description", "Addendum");

                // 画面へ反映
                document.getElementById('scpTitle').textContent = `項目: ${meta.scp}`;
                
                const classBadge = document.getElementById('scpClass');
                classBadge.textContent = `オブジェクトクラス: ${objClass.toUpperCase()}`;
                classBadge.className = `object-class ${objClass.toLowerCase()}`;

                document.getElementById('scpProcedures').innerText = procedures || "収容プロトコル記述なし（またはフォーマット対象外）";
                document.getElementById('scpDescription').innerText = description || "説明記述なし（またはフォーマット対象外）";

                // 画像の処理
                const imgArea = document.getElementById('scpImageArea');
                if (meta.images && meta.images.length > 0) {
                    document.getElementById('scpImage').src = meta.images[0];
                    imgArea.style.display = 'block';
                } else {
                    imgArea.style.display = 'none';
                }

                // リンク
                document.getElementById('scpLink').href = `https://scp-wiki.wikidot.com/scp-${number}`;

                statusDiv.textContent = "アクセス完了。機密情報の取り扱いに注意してください。";
                scpArticle.style.display = 'block';

            } catch (error) {
                // 【修正部分】エラー表示を財団のエラーログ風にアレンジ
                statusDiv.innerHTML = `
                    <div style="color: #ff3333; border: 1px solid #ff3333; padding: 15px; background: #220000; text-align: left; font-size: 0.9rem;">
                        <strong>[ACCESS DENIED / アクセス拒否]</strong><br>
                        原因: 指定されたオブジェクトコードは存在しないか、クリアランス不足により閲覧できません。<br>
                        <span style="color: #aaaaaa; font-size: 0.8rem; display: block; margin-top: 5px;">
                            ※有志APIの仕様上、一部の番号（SCP-1519など）や日本支部（-JP）のデータは未収録です。<br>
                            173, 682, 096, 049 などの有名番号を入力するか、「ランダム抽出」をお試しください。
                        </span>
                    </div>`;
            }
        }

        // テキスト内からセクションを簡易パースする関数
        function parseSection(text, startKeyword, endKeyword) {
            const startIndex = text.toLowerCase().indexOf(startKeyword.toLowerCase());
            if (startIndex === -1) return text.substring(0, 500) + "... (全パース失敗)";
            
            let endIndex = text.toLowerCase().indexOf(endKeyword.toLowerCase(), startIndex);
            if (endIndex === -1) endIndex = text.length;

            let result = text.substring(startIndex + startKeyword.length, endIndex).trim();
            result = result.replace(/^[:\s*#]+/, '');
            return result.length > 800 ? result.substring(0, 800) + "\n\n[...以降はセキュリティ制限により非表示]" : result;
        }

        // イベント設定
        fetchBtn.addEventListener('click', () => {
            const num = parseInt(scpNumberInput.value, 10);
            if(num) loadSCP(num);
        });

        randomBtn.addEventListener('click', () => {
            const randomNum = Math.floor(Math.random() * 2000) + 1;
            scpNumberInput.value = randomNum;
            loadSCP(randomNum);
        });

        // 初期読み込み（デフォルトで確実に起動する173に変更しました）
        loadSCP(scpNumberInput.value);
    </script>
</body>
</html>
