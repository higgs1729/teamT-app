<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>世界時計</title>
<style>
body {
    font-family: sans-serif;
    background: #0f172a;
    color: white;
    text-align: center;
    padding: 30px;
}

select, button {
    padding: 10px;
    font-size: 16px;
    margin: 10px;
}

.clock {
    margin-top: 20px;
    font-size: 22px;
    background: #1e293b;
    padding: 15px;
    border-radius: 10px;
    display: inline-block;
    min-width: 300px;
}
</style>
</head>
<body>

<h1>🌍 世界時計API風（HTML版）</h1>

<select id="city">
    <option value="Asia/Tokyo">東京</option>
    <option value="America/New_York">ニューヨーク</option>
    <option value="Europe/London">ロンドン</option>
    <option value="Asia/Shanghai">上海</option>
    <option value="Australia/Sydney">シドニー</option>
    
</select>

<button onclick="addClock()">追加</button>

<div id="clocks"></div>

<script>
const clocks = [];

function formatTime(timeZone) {
    return new Date().toLocaleString("ja-JP", {
        timeZone: timeZone,
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
    });
}

function addClock() {
    const tz = document.getElementById("city").value;

    const div = document.createElement("div");
    div.className = "clock";

    clocks.push({ tz, div });

    document.getElementById("clocks").appendChild(div);
    updateClocks();
}

function updateClocks() {
    clocks.forEach(c => {
        c.div.innerHTML = `
            <strong>${c.tz}</strong><br>
            🕒 ${formatTime(c.tz)}
        `;
    });
}

// 1秒ごとに更新
setInterval(updateClocks, 1000);
</script>

</body>
</html>
