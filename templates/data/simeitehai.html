<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FBI Wanted List Viewer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0f172a; /* ダークネイビー */
            color: #f8fafc;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 3px solid #ef4444; /* FBIレッド */
            padding-bottom: 20px;
        }
        header h1 {
            font-size: 2.5rem;
            color: #ef4444;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        header p {
            color: #94a3b8;
            font-size: 1.1rem;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        select, button {
            padding: 12px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 6px;
            background-color: #1e293b;
            color: #fff;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        select:focus, button:focus {
            outline: 2px solid #ef4444;
        }
        button {
            background-color: #ef4444;
            font-weight: bold;
        }
        button:hover {
            background-color: #dc2626;
        }
        .loading {
            text-align: center;
            font-size: 1.5rem;
            color: #94a3b8;
            margin-top: 50px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .poster-frame {
            width: 100%;
            height: 350px;
            background-color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 2px solid #ef4444;
            position: relative;
        }
        .poster-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .wanted-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: #ef4444;
            color: white;
            padding: 4px 12px;
            font-weight: bold;
            font-size: 0.8rem;
            text-transform: uppercase;
            border-radius: 4px;
        }
        .card-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .card-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #fff;
            text-transform: uppercase;
        }
        .card-caution {
            font-size: 0.9rem;
            color: #cbd5e1;
            margin-bottom: 15px;
            line-height: 1.4;
            flex-grow: 1;
        }
        .card-meta {
            font-size: 0.85rem;
            color: #94a3b8;
            border-top: 1px solid #334155;
            padding-top: 10px;
        }
        .card-meta span {
            display: block;
            margin-bottom: 4px;
        }
        .reward {
            color: #eab308; /* ゴールド */
            font-weight: bold;
        }
        .view-btn {
            display: block;
            text-align: center;
            background-color: #334155;
            color: white;
            text-decoration: none;
            padding: 10px;
            margin-top: 15px;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .view-btn:hover {
            background-color: #475569;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>FBI Most Wanted</h1>
            <p>連邦捜査局（FBI）公開指名手配リアルタイムビューア</p>
        </header>

        <div class="controls">
            <select id="categorySelect">
                <option value="wanted">通常の指名手配 (Wanted)</option>
                <option value="ten-most-wanted">最重要指名手配 (Top 10)</option>
                <option value="seeking-information">情報提供求む (Seeking Info)</option>
                <option value="kidnappings">誘拐事件 (Kidnappings)</option>
            </select>
            <button id="fetchBtn">データを読み込む</button>
        </div>

        <div id="loading" class="loading" style="display: none;">FBIのデータベースに接続中...</div>

        <div id="wantedGrid" class="grid"></div>
    </div>

    <script>
        const fetchBtn = document.getElementById('fetchBtn');
        const categorySelect = document.getElementById('categorySelect');
        const wantedGrid = document.getElementById('wantedGrid');
        const loading = document.getElementById('loading');

        // FBI APIからデータを取得する関数
        async function fetchWantedData() {
            const category = categorySelect.value;
            // エンドポイント（1ページあたり12件、カテゴリでフィルタ）
            const url = `https://api.fbi.gov/@wanted?pageSize=12&page=1&field_category=${category}`;

            wantedGrid.innerHTML = '';
            loading.style.display = 'block';

            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error('データの取得に失敗しました');
                }
                const data = await response.json();
                
                loading.style.display = 'none';
                displayCards(data.items);
            } catch (error) {
                loading.style.display = 'none';
                wantedGrid.innerHTML = `<p style="color: #ef4444; grid-column: 1/-1; text-align: center;">エラーが発生しました: ${error.message}</p>`;
            }
        }

        // 取得したデータをHTMLに変換して表示する関数
        function displayCards(items) {
            if (!items || items.length === 0) {
                wantedGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">該当するデータが見つかりませんでした。</p>';
                return;
            }

            items.forEach(item => {
                // 画像URLを取得（配列が空の場合はプレースホルダー画像）
                const imageUrl = (item.images && item.images.length > 0) ? item.images[0].original : 'https://via.placeholder.com/350x350?text=NO+IMAGE';
                
                // 容疑や説明文のテキスト（長すぎる場合は100文字でカット）
                const cautionText = item.caution ? item.caution.substring(0, 100) + '...' : (item.description ? item.description.substring(0, 100) + '...' : '詳細情報なし');
                
                // 報奨金テキスト
                const rewardText = item.reward_text ? item.reward_text : '報奨金情報なし';

                // 動的にカード要素を作成
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="poster-frame">
                        <div class="wanted-tag">WANTED</div>
                        <img src="${imageUrl}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/350x350?text=NO+IMAGE'">
                    </div>
                    <div class="card-content">
                        <div class="card-title">${item.title}</div>
                        <div class="card-caution">${cautionText}</div>
                        <div class="card-meta">
                            <span class="reward">💰 報奨金: ${rewardText}</span>
                            <span>📅 公開日: ${item.publication || '不明'}</span>
                        </div>
                        <a href="${item.url}" target="_blank" class="view-btn">FBI公式プロファイル</a>
                    </div>
                `;
                wantedGrid.appendChild(card);
            });
        }

        // イベント設定
        fetchBtn.addEventListener('click', fetchWantedData);
        
        // ページを開いたときに自動で初期データを読み込む
        fetchWantedData();
    </script>
</body>
</html>
