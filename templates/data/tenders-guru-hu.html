<!DOCTYPE html>
<!-- Tenders Guru Hungary: ハンガリーの公共調達JSON APIを一覧表示する自己完結HTML。構成はページ選択、取得、結果カード、フォールバック。 -->
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tenders Guru Hungary</title>
  <style>:root{--ink:#172033;--muted:#667085;--panel:#fff;--line:#dde5ef;--accent:#b45309;--soft:#fff8ed}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Segoe UI",Meiryo,sans-serif;color:var(--ink);background:linear-gradient(135deg,#fff7ed,#f8fafc)}main{width:min(1100px,calc(100% - 28px));margin:auto;padding:28px 0 42px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px;box-shadow:0 14px 34px rgba(120,72,20,.08)}.layout{display:grid;grid-template-columns:.9fr 1.1fr;gap:16px}.tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--accent)}h1{font-size:clamp(28px,4vw,44px);line-height:1.08;margin:10px 0}.lead,.status{color:var(--muted);line-height:1.75}.form{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:16px}input,button{min-height:44px;border-radius:8px;font:inherit}input{border:1px solid var(--line);padding:0 12px}button{border:0;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}.grid{display:grid;gap:10px}.card{border:1px solid var(--line);border-radius:8px;background:var(--soft);padding:14px}.card small{display:block;color:var(--muted);margin-bottom:6px}.card strong{font-size:18px}.link{color:var(--accent);font-weight:700;text-decoration:none}@media(max-width:840px){.layout,.form{grid-template-columns:1fr}}</style>
</head>
<body><main class="layout"><section class="panel"><div class="tag">tenders guru hu</div><h1>ハンガリーの公共調達データを一覧表示</h1><p class="lead">Tenders Guru API は公共調達の入札データをJSONで取得できます。ページ番号を指定して `GET /api/hu/tenders` を呼び出します。</p><div class="form"><input id="page" type="number" min="1" value="1" aria-label="page"><button id="loadBtn" type="button">取得</button></div><p id="status" class="status">ページ番号を指定して取得してください。</p><a class="link" href="https://tenders.guru/hu/api" target="_blank" rel="noreferrer">公式Docs</a></section><section class="panel"><div id="results" class="grid"></div></section></main>
<script>
const country="hu";const countryName="Hungary";const sample=[{id:101,date:"2026-01-15",title:"Public procurement sample in Hungary",description:"API取得失敗時の表示サンプルです。"}];
function render(items,fallback){document.getElementById("status").textContent=fallback?"ライブ取得できなかったためサンプルを表示しています。":`${items.length}件を表示しています。`;document.getElementById("results").innerHTML=items.map((item)=>`<article class="card"><small>${countryName} / ${item.date||"-"} / ID ${item.id||"-"}</small><strong>${item.title||"-"}</strong><p class="status">${item.description||""}</p></article>`).join("")}
async function loadTenders(){const page=Math.max(1,Number(document.getElementById("page").value||1));document.getElementById("status").textContent="loading...";try{const res=await fetch(`https://tenders.guru/api/${country}/tenders?page=${page}`,{cache:"no-store"});if(!res.ok)throw new Error(`HTTP ${res.status}`);const json=await res.json();const items=(json.data||[]).slice(0,10);if(!items.length)throw new Error("empty");render(items,false)}catch(error){console.warn(error);render(sample,true)}}document.getElementById("loadBtn").addEventListener("click",loadTenders);render(sample,false);
</script></body></html>
