<!DOCTYPE html>
<!--
  TWZRD Agent Intel Tester
  目的: Solana上のAIエージェント信頼スコアAPI候補を、キー入力式で安全に紹介する。
  構成: APIキー入力 / ウォレット入力 / スコア取得の試行 / サンプル結果。
-->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TWZRD Agent Intel Tester</title>
  <style>
    :root{--ink:#101828;--muted:#667085;--panel:#fff;--line:#ded7f5;--accent:#7c3aed;--ok:#0f766e}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Segoe UI",Meiryo,sans-serif;color:var(--ink);background:linear-gradient(135deg,#faf5ff,#eefdf7)}
    main{width:min(1080px,calc(100% - 28px));margin:auto;padding:28px 0 42px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px;box-shadow:0 14px 34px rgba(58,36,100,.08)}.layout{display:grid;grid-template-columns:.95fr 1.05fr;gap:16px}.tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--accent)}h1{font-size:clamp(28px,4vw,44px);line-height:1.08;margin:10px 0}.lead,.status{color:var(--muted);line-height:1.75}.form{display:grid;gap:10px;margin-top:16px}input,button{min-height:44px;border-radius:8px;font:inherit}input{border:1px solid var(--line);padding:0 12px}button{border:0;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}.score{display:grid;grid-template-columns:140px 1fr;gap:16px;align-items:center}.ring{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--score)*1%),#eee 0);font-size:30px;font-weight:800}.details{border:1px solid var(--line);border-radius:8px;padding:16px;background:#fcfbff}.details pre{white-space:pre-wrap;margin:0;color:#344054}.link{color:var(--accent);font-weight:700;text-decoration:none}@media(max-width:840px){.layout,.score{grid-template-columns:1fr}.ring{margin:auto}}
  </style>
</head>
<body>
  <main class="layout">
    <section class="panel">
      <div class="tag">twzrd agent intel</div>
      <h1>Solanaウォレットの信頼スコアを確認する形だけ安全に試す</h1>
      <p class="lead">TWZRD Agent Intel はAIエージェント関連ウォレットのスコアリングを扱うAPI候補です。APIキーが必要なため、キーは入力欄からのみ利用し、保存しません。</p>
      <div class="form">
        <input id="wallet" value="AgentWalletDemo111111111111111111111111111" aria-label="Solana wallet">
        <input id="key" type="password" placeholder="APIキーまたはMCPトークン" aria-label="API key">
        <button id="loadBtn" type="button">スコア取得を試す</button>
      </div>
      <p id="status" class="status">キー未入力やCORS失敗時はサンプル表示に切り替わります。</p>
      <a class="link" href="https://intel.twzrd.xyz" target="_blank" rel="noreferrer">公式ページ</a>
    </section>
    <section class="panel">
      <div class="score">
        <div id="ring" class="ring" style="--score:72">72</div>
        <div class="details"><pre id="details"></pre></div>
      </div>
    </section>
  </main>
  <script>
    const sample = {wallet:"AgentWalletDemo111111111111111111111111111", score:72, risk:"medium", signals:["wallet age: sample", "agent activity: sample", "verification: sample"], note:"APIキー未使用時のデモデータです。"};
    function render(data, fallback){
      document.getElementById("ring").style.setProperty("--score", data.score);
      document.getElementById("ring").textContent = data.score;
      document.getElementById("status").textContent = fallback ? "ライブ取得できなかったためサンプルを表示しています。" : "取得に成功しました。";
      document.getElementById("details").textContent = JSON.stringify(data, null, 2);
    }
    async function loadScore(){
      const wallet = document.getElementById("wallet").value.trim();
      const key = document.getElementById("key").value.trim();
      document.getElementById("status").textContent = "loading...";
      try{
        if(!key) throw new Error("missing key");
        const res = await fetch(`https://intel.twzrd.xyz/api/score/${encodeURIComponent(wallet)}`, {headers:{"Authorization":`Bearer ${key}`}, cache:"no-store"});
        if(!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        render({wallet, score:Number(json.score || 0), risk:json.risk || "unknown", raw:json}, false);
      }catch(error){
        console.warn(error);
        render({...sample, wallet}, true);
      }
    }
    document.getElementById("loadBtn").addEventListener("click", loadScore);
    render(sample, false);
  </script>
</body>
</html>
