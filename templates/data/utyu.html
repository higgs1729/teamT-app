<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA NEO (近地天体) 観測ダッシュボード</title>
    <style>
        :root {
            --space-bg: #0b0d18;
            --card-bg: #161b33;
            --text-main: #f0f3f8;
            --text-muted: #a0aec0;
            --accent-blue: #4d7cff;
            --danger: #ff4d4d;
            --warning: #ffaa00;
            --success: #00e676;
        }
 
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--space-bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
 
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
 
        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #232946;
            margin-bottom: 30px;
        }
 
        h1 {
            margin: 0;
            font-size: 2rem;
            letter-spacing: 1px;
        }
 
        h1 span {
            color: var(--accent-blue);
        }
 
        .subtitle {
            color: var(--text-muted);
            margin-top: 5px;
            font-size: 0.95rem;
        }
 
        /* 検索パネル */
        .search-panel {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            border: 1px solid #232946;
        }
 
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
        }
 
        .form-group {
            flex: 1;
            min-width: 200px;
        }
 
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
        }
 
        .form-group input {
            width: 100%;
            padding: 10px;
            background: #0f1123;
            border: 1px solid #3d4675;
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
            box-sizing: border-box;
        }
 
        .form-group input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }
 
        button {
            background: linear-gradient(135deg, #3a62d7, #4d7cff);
            color: white;
            border: none;
            padding: 11px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(77,124,255,0.3);
        }
 
        button:hover {
            transform: translateY(-1px);
        }
 
        /* ローディングローダー */
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: var(--accent-blue);
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
 
        #statusMessage {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
        }
 
        /* 天気・天体リストのグリッドスタイル */
        .date-section {
            margin-bottom: 40px;
        }
 
        .date-header {
            font-size: 1.3rem;
            border-left: 4px solid var(--accent-blue);
            padding-left: 10px;
            margin-bottom: 15px;
            color: #fff;
        }
 
        .neo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
 
        .neo-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 18px;
            border: 1px solid #232946;
            position: relative;
            transition: transform 0.2s ease;
        }
 
        .neo-card:hover {
            transform: translateY(-3px);
            border-color: #3d4675;
        }
 
        /* 潜在的危険天体(Hazardous)のカラー分岐 */
        .neo-card.hazardous { border-top: 4px solid var(--danger); }
        .neo-card.safe { border-top: 4px solid var(--success); }
 
        .badge {
            display: inline-block;
            padding: 3px 8px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 4px;
        }
        .badge.danger { background: rgba(255, 77, 77, 0.15); color: var(--danger); }
        .badge.success { background: rgba(0, 230, 118, 0.15); color: var(--success); }
 
        .neo-name {
            font-size: 1.1rem;
            font-weight: bold;
            margin: 0 0 10px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70%;
        }
 
        .neo-info {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 6px 0;
        }
 
        .neo-info strong { color: var(--text-main); }
 
        .link-button {
            display: block;
            text-align: center;
            background: #232946;
            color: var(--text-main);
            text-decoration: none;
            padding: 8px;
            margin-top: 15px;
            border-radius: 5px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
 
<div class="container">
    <header>
        <h1>🚀 NASA <span>NEO</span> Tracker</h1>
        <div class="subtitle">地球に接近する小惑星・彗星（近地天体）のリアルタイム監視</div>
    </header>
 
    <div class="search-panel">
        <div class="form-row">
            <div class="form-group">
                <label for="apiKey">NASA API KEY</label>
                <input type="text" id="apiKey" value="DEMO_KEY">
            </div>
            <div class="form-group">
                <label for="startDate">開始日 (START_DATE)</label>
                <input type="date" id="startDate">
            </div>
            <div class="form-group">
                <label for="endDate">終了日 (END_DATE)</label>
                <input type="date" id="endDate">
            </div>
            <div>
                <button onclick="fetchNeoData()">データ取得</button>
            </div>
        </div>
    </div>
 
    <div id="statusMessage">日付を選択して「データ取得」ボタンを押してください。</div>
    <div id="neoContainer"></div>
</div>
 
<script>
    // 画面を開いた時に、自動で「今日」の日付を入力欄にセット
    window.addEventListener('DOMContentLoaded', () => {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        const dateStr = `${yyyy}-${mm}-${dd}`;
        document.getElementById('startDate').value = dateStr;
        document.getElementById('endDate').value = dateStr;
    });
 
    // NASA APIをコールする非同期関数
    async function fetchNeoData() {
        const apiKey = document.getElementById('apiKey').value.trim() || 'DEMO_KEY';
        const startDate = document.getElementById('startDate').value;
        const endDate = document.getElementById('endDate').value;
       
        const statusMessage = document.getElementById('statusMessage');
        const neoContainer = document.getElementById('neoContainer');
       
        if (!startDate || !endDate) {
            alert('日付を正しく設定してください。');
            return;
        }
 
        // 読み込み中表示
        statusMessage.innerHTML = '<div class="spinner"></div>NASAのデータベースにアクセス中...';
        neoContainer.innerHTML = '';
 
        // URLの組み立て
        const url = `https://api.nasa.gov/neo/rest/v1/feed?start_date=${startDate}&end_date=${endDate}&api_key=${apiKey}`;
 
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`通信エラー (ステータス: ${response.status})`);
           
            const data = await response.json();
            statusMessage.innerHTML = ''; // メッセージの初期化
           
            // 描画関数へデータを渡す
            renderNeoData(data.near_earth_objects);
        } catch (error) {
            statusMessage.innerHTML = `<span style="color:var(--danger)">❌ データの取得に失敗しました。<br>${error.message}</span>`;
            console.error(error);
        }
    }
 
    // 取得したデータをHTML要素に落とし込む関数
    function renderNeoData(neoData) {
        const neoContainer = document.getElementById('neoContainer');
        const sortedDates = Object.keys(neoData).sort(); // 日付順に並び替え
 
        sortedDates.forEach(date => {
            const dateSection = document.createElement('div');
            dateSection.className = 'date-section';
           
            const dateHeader = document.createElement('div');
            dateHeader.className = 'date-header';
            dateHeader.innerText = `${date} (接近天体: ${neoData[date].length}件)`;
            dateSection.appendChild(dateHeader);
           
            const neoGrid = document.createElement('div');
            neoGrid.className = 'neo-grid';
           
            // 各天体ループ
            neoData[date].forEach(neo => {
                const isHazardous = neo.is_potentially_hazardous_asteroid;
                const card = document.createElement('div');
                card.className = `neo-card ${isHazardous ? 'hazardous' : 'safe'}`;
               
                // 直径計算 (最小〜最大メートル)
                const dMin = Math.round(neo.estimated_diameter.meters.estimated_diameter_min);
                const dMax = Math.round(neo.estimated_diameter.meters.estimated_diameter_max);
               
                // 最接近情報
                const approach = neo.close_approach_data[0];
                const missDistance = approach
                    ? parseFloat(approach.miss_distance.kilometers).toLocaleString(undefined, {maximumFractionDigits: 0}) + ' km'
                    : '不明';
                const velocity = approach
                    ? parseFloat(approach.relative_velocity.kilometers_per_hour).toLocaleString(undefined, {maximumFractionDigits: 0}) + ' km/h'
                    : '不明';
 
                card.innerHTML = `
                    <span class="badge ${isHazardous ? 'danger' : 'success'}">${isHazardous ? '⚠️ 危険度高' : '✅ 安全'}</span>
                    <div class="neo-name" title="${neo.name}">${neo.name}</div>
                    <div class="neo-info">推定直径: <strong>${dMin} 〜 ${dMax} m</strong></div>
                    <div class="neo-info">最接近距離: <strong>${missDistance}</strong></div>
                    <div class="neo-info">移動速度: <strong>${velocity}</strong></div>
                    <a href="${neo.nasa_jpl_url}" target="_blank" class="link-button">JPL詳細軌道データ 🔗</a>
                `;
                neoGrid.appendChild(card);
            });
           
            dateSection.appendChild(neoGrid);
            neoContainer.appendChild(dateSection);
        });
    }
</script>
</body>
</html>
