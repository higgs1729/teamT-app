<!DOCTYPE html>
<!--
  Walltime Market Info Viewer
  目的: Walltime の市場情報API候補を、APIキー入力式のマーケットカードとして紹介する。
  構成: キー/銘柄入力 / フェッチ試行 / サンプルマーケット表示 / 公式リンク。
-->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walltime Market Info Viewer</title>
  <style>
    :root{--ink:#172033;--muted:#667085;--panel:#fff;--line:#dde5ef;--accent:#2563eb;--up:#0f9f6e;--down:#b42318}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Segoe UI",Meiryo,sans-serif;color:var(--ink);background:linear-gradient(135deg,#eff6ff,#f8fafc)}
    main{width:min(1080px,calc(100% - 28px));margin:auto;padding:28px 0 42px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px;box-shadow:0 14px 34px rgba(15,45,96,.08)}.layout{display:grid;grid-template-columns:.95fr 1.05fr;gap:16px}.tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--accent)}h1{font-size:clamp(28px,4vw,44px);line-height:1.08;margin:10px 0}.lead,.status{color:var(--muted);line-height:1.75}.form{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin-top:16px}input,button{min-height:44px;border-radius:8px;font:inherit}input{border:1px solid var(--line);padding:0 12px}button{border:0;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}.market{display:grid;gap:10px}.quote{border:1px solid var(--line);border-radius:8px;padding:16px;background:#fbfcff}.quote small{color:var(--muted);display:block;margin-bottom:6px}.quote strong{font-size:28px}.quote .up{color:var(--up)}.quote pre{white-space:pre-wrap;margin:10px 0 0;color:#344054}.link{color:var(--accent);font-weight:700;text-decoration:none}@media(max-width:840px){.layout,.form{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="layout">
    <section class="panel">
      <div class="tag">walltime</div>
      <h1>市場情報APIのレスポンスをカードで確認</h1>
      <p class="lead">Walltime は市場情報取得用APIとして候補に入っているサービスです。公式ページの仕様に合わせてURLを調整できるよう、エンドポイント入力式でライブ取得を試します。</p>
      <div class="form">
        <input id="endpoint" value="https://walltime.info/api.html" aria-label="Endpoint">
        <input id="key" type="password" placeholder="APIキーが必要な場合" aria-label="API key">
        <button id="loadBtn" type="button">取得</button>
      </div>
      <p id="status" class="status">HTMLドキュメントやCORS制限が返る場合はサンプル表示になります。</p>
      <a class="link" href="https://walltime.info/api.html" target="_blank" rel="noreferrer">公式APIページ</a>
    </section>
    <section class="panel"><div id="market" class="market"></div></section>
  </main>
  <script>
    const sample = {symbol:"WTI-DEMO", last:"102.48", change:"+1.26%", market:"sample", time:new Date().toISOString(), note:"ライブ取得失敗時の表示例です。"};
    function render(data, fallback){
      document.getElementById("status").textContent = fallback ? "ライブ取得できなかったためサンプルを表示しています。" : "取得に成功しました。";
      document.getElementById("market").innerHTML = `<article class="quote"><small>${data.symbol || "market"}</small><strong>${data.last || data.price || "-"}</strong><span class="up"> ${data.change || ""}</span><pre>${JSON.stringify(data, null, 2)}</pre></article>`;
    }
    async function loadMarket(){
      const endpoint = document.getElementById("endpoint").value.trim();
      const key = document.getElementById("key").value.trim();
      document.getElementById("status").textContent = "loading...";
      try{
        const headers = key ? {"Authorization":`Bearer ${key}`} : {};
        const res = await fetch(endpoint, {headers, cache:"no-store"});
        if(!res.ok) throw new Error(`HTTP ${res.status}`);
        const contentType = res.headers.get("content-type") || "";
        if(!contentType.includes("json")) throw new Error("JSON response is required for this card view");
        render(await res.json(), false);
      }catch(error){
        console.warn(error);
        render(sample, true);
      }
    }
    document.getElementById("loadBtn").addEventListener("click", loadMarket);
    render(sample, false);
  </script>
</body>
</html>
