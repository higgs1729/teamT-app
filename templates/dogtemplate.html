<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>わんちゃん画像ギャラリー</title>

    <style>
        body {
            font-family: "Yu Gothic", sans-serif;
            background: #f4f7fb;
            text-align: center;
            margin: 0;
            padding: 30px;
            color: #333;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #1565c0;
        }

        p {
            color: #666;
        }

        button {
            background: #1565c0;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            margin: 5px;
        }

        button:hover {
            background: #0d47a1;
        }

        select {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin: 10px;
            font-size: 15px;
        }

        img {
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            margin-top: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

<div class="container">

    <h1>🐶 わんちゃん画像ギャラリー</h1>

    <p>
        ランダムな犬の画像や犬種ごとの画像を表示できます
    </p>

    <button onclick="getRandomDog()">
        ランダムなわんちゃん
    </button>

    <br>

    <select id="breedSelect">
        <option>犬種を読み込み中...</option>
    </select>

    <button onclick="getBreedDog()">
        この犬種を表示
    </button>

    <div>
        <img id="dogImage" src="" alt="犬の画像">
    </div>

</div>

<script>
const API_URL = "https://dog.ceo/api";

const breedNamesJa = {
    akita: "秋田犬",
    beagle: "ビーグル",
    boxer: "ボクサー",
    bulldog: "ブルドッグ",
    chihuahua: "チワワ",
    chow: "チャウチャウ",
    dalmatian: "ダルメシアン",
    doberman: "ドーベルマン",
    husky: "シベリアンハスキー",
    labrador: "ラブラドール",
    maltese: "マルチーズ",
    pomeranian: "ポメラニアン",
    poodle: "プードル",
    pug: "パグ",
    rottweiler: "ロットワイラー",
    samoyed: "サモエド",
    shiba: "柴犬",
    shihtzu: "シーズー",
    terrier: "テリア",
    weimaraner: "ワイマラナー"
};

async function loadBreeds() {
    const response = await fetch(
        `${API_URL}/breeds/list/all`
    );

    const data = await response.json();

    const select =
        document.getElementById("breedSelect");

    select.innerHTML = "";

    Object.keys(data.message)
        .sort()
        .forEach(breed => {

        const option =
            document.createElement("option");

        option.value = breed;

        option.textContent =
            breedNamesJa[breed] || breed;

        select.appendChild(option);
    });
}

async function getRandomDog() {
    const response = await fetch(
        `${API_URL}/breeds/image/random`
    );

    const data = await response.json();

    document.getElementById("dogImage").src =
        data.message;
}

async function getBreedDog() {

    const breed =
        document.getElementById("breedSelect").value;

    const response = await fetch(
        `${API_URL}/breed/${breed}/images/random`
    );

    const data = await response.json();

    document.getElementById("dogImage").src =
        data.message;
}

loadBreeds();
getRandomDog();
</script>

</body>
</html>
