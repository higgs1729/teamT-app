<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nekos.best Viewer</title>

<style>
body{
    background:#181818;
    color:white;
    text-align:center;
    font-family:sans-serif;
    padding:20px;
}

h1{
    color:#66ccff;
}

.container{
    max-width:600px;
    margin:auto;
    background:#252525;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.5);
}

img{
    width:100%;
    max-width:500px;
    border-radius:10px;
    margin-top:15px;
}

button{
    margin-top:15px;
    padding:10px 20px;
    border:none;
    border-radius:8px;
    background:#66ccff;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    opacity:0.8;
}
</style>
</head>
<body>

<div class="container">
    <h1>🌸 Nekos.best Viewer</h1>

    <button onclick="loadImage()">
        ランダム画像取得
    </button>

    <br>

    <img id="animeImage" src="" alt="画像を読み込み中">
</div>

<script>

async function loadImage(){

    try{

        const response =
        await fetch(
            "https://nekos.best/api/v2/neko"
        );

        const data = await response.json();

        document.getElementById("animeImage").src =
            data.results[0].url;

    }catch(error){

        console.error(error);

        alert("画像の取得に失敗しました");

    }

}

loadImage();

</script>

</body>
</html>
