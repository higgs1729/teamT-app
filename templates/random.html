<!DOCTYPE html>
<html lang="ja">
 
<head>
<meta charset="UTF-8">
<title>画像API表示テンプレート</title>
 
<style>
 
body{
    font-family: Arial, sans-serif;
    text-align:center;
}
 
img{
    width:400px;
    height:auto;
    border-radius:10px;
}
 
.card{
    margin:20px auto;
    padding:20px;
    width:450px;
    border:1px solid #ccc;
    border-radius:10px;
}
 
</style>
 
</head>
 
 
<body>
 
 
<h1>ランダム画像API</h1>
 
 
<button onclick="loadImage()">
画像を表示
</button>
 
 
<div id="result"></div>
 
 
 
<script>
 
 
async function loadImage(){
 
 
    // Picsum API
    const response = await fetch(
    "https://picsum.photos/id/0/info"
    );
 
 
    const data = await response.json();
 
 
 
    document.getElementById("result").innerHTML = `
 
    <div class="card">
 
    <h2>ID:${data.id}</h2>
 
 
    <img src="${data.download_url}">
 
 
    <p>
    作者：
    ${data.author}
    </p>
 
 
    <p>
    サイズ：
    ${data.width}px × ${data.height}px
    </p>
 
 
    <p>
    元URL：
    <a href="${data.url}" target="_blank">
    Unsplashを見る
    </a>
    </p>
 
 
    </div>
 
    `;
 
 
}
 
 
</script>
 
 
</body>
 
</html>
