<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名前から性別を自動判別</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-sub: #666666;
            --accent-blue: #3498db;
            --accent-pink: #e74c3c;
            --border-color: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 入力エリア */
        .input-container {
            width: 100%;
            max-width: 350px;
            margin-bottom: 25px;
            text-align: center;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #555;
        }

        button {
            padding: 0 20px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #555;
        }

        .hint {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 8px;
            text-align: left;
        }

        /* プロフィールカード */
        .profile-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            padding: 30px;
            width: 100%;
            max-width: 350px;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
            position: relative;
        }

        /* ローディング中マスク */
        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.8);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        .loading .loading-overlay {
            opacity: 1;
            pointer-events: auto;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            background-color: #95a5a6;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            margin: 0 auto 15px;
            text-transform: uppercase;
            transition: background-color 0.3s;
        }

        .name {
            font-size: 24px;
            font-weight: 600;
            margin: 0;
            color: var(--text-main);
            text-transform: capitalize;
        }

        .info-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 15px;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .label {
            color: var(--text-sub);
            font-weight: 500;
        }

        .value {
            font-weight: 600;
            color: var(--text-main);
        }

        /* テーマ（動的に変化） */
        .male-theme .avatar { background-color: var(--accent-blue); }
        .male-theme .gender-value { color: var(--accent-blue); }

        .female-theme .avatar { background-color: var(--accent-pink); }
        .female-theme .gender-value { color: var(--accent-pink); }
        
        .unknown-theme .avatar { background-color: #95a5a6; }
        .unknown-theme .gender-value { color: #95a5a6; }
    </style>
</head>
<body>

    <!-- 入力エリア -->
    <div class="input-container">
        <div class="input-wrapper">
            <input type="text" id="nameInput" placeholder="名前をローマ字で入力" value="jon">
            <button id="searchBtn">判別</button>
        </div>
        <div class="hint">※「jon」「anna」「mike」などローマ字で入力してください。</div>
    </div>

    <!-- 判別・表示カード -->
    <div id="profileCard" class="profile-card male-theme">
        <div id="loadingOverlay" class="loading-overlay">判別中...</div>
        
        <div class="profile-header">
            <div id="avatar" class="avatar">j</div>
            <h1 id="name" class="name">jon</h1>
        </div>
        
        <ul class="info-list">
            <li class="info-item">
                <span class="label">性別 (Gender)</span>
                <span id="gender" class="value gender-value">male</span>
            </li>
            <li class="info-item">
                <span class="label">確率 (Probability)</span>
                <span id="probability" class="value">99%</span>
            </li>
            <li class="info-item">
                <span class="label">カウント (Count)</span>
                <span id="count" class="value">301,029</span>
            </li>
        </ul>
    </div>

    <script>
        const nameInput = document.getElementById('nameInput');
        const searchBtn = document.getElementById('searchBtn');
        const profileCard = document.getElementById('profileCard');
        
        const avatar = document.getElementById('avatar');
        const nameEl = document.getElementById('name');
        const genderEl = document.getElementById('gender');
        const probabilityEl = document.getElementById('probability');
        const countEl = document.getElementById('count');

        async function fetchGenderData() {
            const name = nameInput.value.trim().toLowerCase();
            if (!name) return;

            // ローディング開始
            profileCard.classList.add('loading');

            try {
                // 無料の名前性別判定API（Genderize.io）を呼び出し
                const response = await fetch(`https://api.genderize.io/?name=${name}`);
                const data = await response.json();

                // カードへのデータ反映
                nameEl.textContent = data.name;
                avatar.textContent = data.name.charAt(0);

                // 性別の判定とテーマ変更
                profileCard.className = 'profile-card'; // クラスリセット
                if (data.gender === 'male') {
                    genderEl.textContent = 'male';
                    profileCard.classList.add('male-theme');
                } else if (data.gender === 'female') {
                    genderEl.textContent = 'female';
                    profileCard.classList.add('female-theme');
                } else {
                    genderEl.textContent = 'unknown';
                    profileCard.classList.add('unknown-theme');
                }

                // 確率の表示（例: 0.99 -> 99%）
                if (data.probability) {
                    probabilityEl.textContent = Math.round(data.probability * 100) + '%';
                } else {
                    probabilityEl.textContent = '0%';
                }

                // カウントの表示（3桁区切り）
                if (data.count) {
                    countEl.textContent = data.count.toLocaleString();
                } else {
                    countEl.textContent = '0';
                }

            } catch (error) {
                alert('データの取得に失敗しました。時間をおいて再度お試しください。');
                console.error(error);
            } finally {
                // ローディング終了
                profileCard.classList.remove('loading');
            }
        }

        // イベントリスナー
        searchBtn.addEventListener('click', fetchGenderData);
        nameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') fetchGenderData();
        });
    </script>

</body>
</html>
