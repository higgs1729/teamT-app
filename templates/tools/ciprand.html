<!DOCTYPE html>
<!--
  Ciprand API紹介ページ
  目的: セキュアなランダム文字列API候補を紹介し、API不可時もWeb Cryptoで同等デモを行う。
  構成: 長さ指定 / API fetch / Web Cryptoフォールバック / 文字列表示。
-->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ciprand Random String</title>
  <style>
    :root{--bg:#f5f5f5;--panel:#fff;--ink:#222831;--muted:#68707f;--line:#dde2e9;--accent:#2f6ef0;--soft:#eaf1ff;--danger:#c43d3d}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"BIZ UDPGothic","Meiryo UI",sans-serif;background:linear-gradient(135deg,#f5f5f5,#edf4ff);color:var(--ink)}
    main{width:min(900px,100%);margin:auto;padding:34px 18px}h1{margin:0 0 8px;font-size:clamp(24px,4vw,38px);letter-spacing:0}p{margin:0;color:var(--muted);line-height:1.7}a{color:var(--accent)}
    .panel{margin-top:18px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:0 14px 32px rgba(40,60,90,.08)}
    .row{display:grid;grid-template-columns:1fr 150px;gap:10px;margin-top:16px}input,button{font:inherit;border-radius:10px;padding:11px 12px}input{border:1px solid var(--line)}button{border:0;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
    .status{margin:16px 0 10px;color:var(--muted);font-weight:700}.status.error{color:var(--danger)}.output{padding:16px;border-radius:12px;background:#172033;color:#dbe8ff;word-break:break-all;font-size:20px;line-height:1.5;min-height:90px}
    @media(max-width:720px){.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <h1>Ciprand Random String</h1>
  <p>Ciprandはセキュアなランダム文字列生成API候補です。公開エンドポイントが利用できない場合も、ブラウザのWeb Cryptoで同じ用途のデモを行います。</p>
  <section class="panel">
    <div class="row"><input id="length" type="number" min="8" max="64" value="24" aria-label="文字数"><button id="generate">生成</button></div>
    <p class="status" id="status">未生成です。</p>
    <div class="output" id="output">ボタンを押すとランダム文字列を生成します。</div>
    <p style="margin-top:14px;font-size:12px;">Docs: <a href="https://github.com/polarspetroll/ciprand" target="_blank" rel="noreferrer">https://github.com/polarspetroll/ciprand</a></p>
  </section>
</main>
<script>
const chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
function localRandom(len){const bytes=new Uint8Array(len);crypto.getRandomValues(bytes);return [...bytes].map(b=>chars[b%chars.length]).join("")}
document.getElementById("generate").addEventListener("click",async()=>{const len=Math.max(8,Math.min(64,Number(document.getElementById("length").value)||24));const statusEl=document.getElementById("status"),out=document.getElementById("output");statusEl.className="status";statusEl.textContent="APIを試行中...";try{const r=await fetch(`https://ciprand.polarspetroll.repl.co/api?length=${len}`);if(!r.ok)throw new Error(`HTTP ${r.status}`);const text=await r.text();statusEl.textContent="APIから生成しました。";out.textContent=text;}catch(err){statusEl.className="status error";statusEl.textContent="API取得不可のためWeb Cryptoで生成しました。";out.textContent=localRandom(len);}});
</script>
</body>
</html>
