<!DOCTYPE html>
<!--
  CodeX API紹介ページ
  目的: オンラインコンパイラAPI候補を紹介し、コード実行リクエストの形を安全に確認する。
  構成: 言語/コード入力 / API送信（失敗時はリクエストJSON表示） / セキュリティ注意。
-->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeX Compiler Request Builder</title>
  <style>
    :root{--bg:#f5f6fb;--panel:#fff;--ink:#202536;--muted:#667086;--line:#dce4ef;--accent:#2f6ef0;--soft:#eaf1ff;--danger:#c43d3d}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"BIZ UDPGothic","Meiryo UI",sans-serif;background:linear-gradient(135deg,#f5f6fb,#eef7ff);color:var(--ink)}
    main{width:min(1040px,100%);margin:auto;padding:32px 18px}h1{margin:0 0 8px;font-size:clamp(24px,4vw,38px);letter-spacing:0}p{margin:0;color:var(--muted);line-height:1.7}a{color:var(--accent)}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.panel{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:0 14px 30px rgba(50,60,90,.08)}
    label{display:block;margin:14px 0 7px;font-weight:700;font-size:13px}select,textarea,button{width:100%;font:inherit;border-radius:10px;padding:11px 12px}select,textarea{border:1px solid var(--line)}textarea{min-height:240px;resize:vertical;font-family:Consolas,monospace}button{margin-top:16px;border:0;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
    .status{font-weight:700;color:var(--muted);margin-bottom:12px}.status.error{color:var(--danger)}pre{margin:0;min-height:330px;padding:14px;border-radius:12px;background:#172033;color:#dbe8ff;white-space:pre-wrap;overflow:auto}
    @media(max-width:760px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <h1>CodeX Compiler Request Builder</h1>
  <p>CodeXは複数言語のオンラインコンパイルAPI候補です。実行APIは環境やCORSに左右されるため、ここでは安全にリクエスト形状を確認できます。</p>
  <section class="grid">
    <form class="panel" id="form"><label>言語</label><select id="language"><option value="py">Python</option><option value="js">JavaScript</option><option value="java">Java</option></select><label>コード</label><textarea id="code">print("hello webapi")</textarea><button>APIへ送信を試す</button><p style="margin-top:12px;font-size:12px;">Docs: <a href="https://github.com/Jaagrav/CodeX" target="_blank" rel="noreferrer">CodeX GitHub</a></p></form>
    <section class="panel"><p class="status" id="status">未送信です。</p><pre id="output">リクエストJSONまたはレスポンスを表示します。</pre></section>
  </section>
</main>
<script>
document.getElementById("form").addEventListener("submit",async e=>{e.preventDefault();const body={code:document.getElementById("code").value,language:document.getElementById("language").value,input:""};const statusEl=document.getElementById("status"),out=document.getElementById("output");statusEl.className="status";statusEl.textContent="送信中...";try{const r=await fetch("https://api.codex.jaagrav.in",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});if(!r.ok)throw new Error(`HTTP ${r.status}`);const data=await r.json();statusEl.textContent="成功: 実行結果を取得しました。";out.textContent=JSON.stringify(data,null,2);}catch(err){statusEl.className="status error";statusEl.textContent="送信不可のため、リクエスト例を表示します。";out.textContent=JSON.stringify({endpoint:"https://api.codex.jaagrav.in",method:"POST",body,fallback:true,message:err.message},null,2);}});
</script>
</body>
</html>
