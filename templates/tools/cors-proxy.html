<!DOCTYPE html>
<!--
  CORS Proxy紹介ページ
  目的: CORS回避用プロキシAPI候補の使い方とリスクを確認する。
  構成: URL入力 / プロキシURL生成 / fetch試行 / セキュリティ注意。
-->
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CORS Proxy URL Builder</title>
<style>
:root{--bg:#f6f7fb;--panel:#fff;--ink:#202536;--muted:#667086;--line:#dde5ef;--accent:#2f6ef0;--soft:#eaf1ff;--danger:#c43d3d}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"BIZ UDPGothic","Meiryo UI",sans-serif;background:linear-gradient(135deg,#f6f7fb,#eef7ff);color:var(--ink)}main{width:min(900px,100%);margin:auto;padding:34px 18px}h1{margin:0 0 8px;font-size:clamp(24px,4vw,38px);letter-spacing:0}p{margin:0;color:var(--muted);line-height:1.7}a{color:var(--accent)}.panel{margin-top:18px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:0 14px 30px rgba(50,60,90,.08)}label{display:block;margin:14px 0 7px;font-weight:700;font-size:13px}input,button{width:100%;font:inherit;border-radius:10px;padding:11px 12px}input{border:1px solid var(--line)}button{margin-top:14px;border:0;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}.status{font-weight:700;color:var(--muted);margin:16px 0 10px}.status.error{color:var(--danger)}pre{padding:14px;border-radius:12px;background:#172033;color:#dbe8ff;white-space:pre-wrap;word-break:break-all;min-height:160px}
</style></head>
<body><main><h1>CORS Proxy URL Builder</h1><p>CORS制限で直接取得できないAPIをプロキシ経由で試すための候補です。機密情報やAPIキーをプロキシへ送らないよう注意します。</p><section class="panel"><label>取得したいURL</label><input id="target" value="https://httpbin.org/json"><button id="run">プロキシURLを作る</button><p class="status" id="status">未作成です。</p><pre id="out"></pre><p style="font-size:12px">Docs: <a href="https://github.com/burhanuday/cors-proxy" target="_blank" rel="noreferrer">cors-proxy GitHub</a></p></section></main>
<script>
document.getElementById("run").addEventListener("click",async()=>{const target=document.getElementById("target").value.trim();const proxy=`https://corsproxy.io/?${encodeURIComponent(target)}`;const status=document.getElementById("status"),out=document.getElementById("out");status.className="status";status.textContent="取得を試行中...";try{const r=await fetch(proxy);if(!r.ok)throw new Error(`HTTP ${r.status}`);const text=await r.text();status.textContent="成功: プロキシ経由で取得しました。";out.textContent=text.slice(0,4000);}catch(e){status.className="status error";status.textContent="取得不可。プロキシURL例を表示します。";out.textContent=JSON.stringify({proxy,target,warning:"APIキーや個人情報を送らないこと",message:e.message},null,2);}});
</script></body></html>
