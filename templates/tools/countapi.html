<!DOCTYPE html>
<!-- CountAPI紹介ページ: 名前空間とキーを指定し、カウンターAPIの呼び出し例を確認する。 -->
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CountAPI Counter</title><style>
:root{--bg:#f7f5fb;--panel:#fff;--ink:#202536;--muted:#667086;--line:#e0ddea;--accent:#7b61ff;--soft:#f0ecff;--danger:#c43d3d}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"BIZ UDPGothic","Meiryo UI",sans-serif;background:linear-gradient(135deg,#f7f5fb,#eef7ff);color:var(--ink)}main{width:min(900px,100%);margin:auto;padding:34px 18px}h1{margin:0 0 8px;font-size:clamp(24px,4vw,38px);letter-spacing:0}p{margin:0;color:var(--muted);line-height:1.7}a{color:var(--accent)}.panel{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:0 14px 30px rgba(70,60,95,.08)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}label{font-weight:700;font-size:13px}input,button{width:100%;font:inherit;border-radius:10px;padding:11px 12px;margin-top:7px}input{border:1px solid var(--line)}button{border:0;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}.num{margin:18px 0;padding:22px;border-radius:15px;background:var(--soft);font-size:54px;font-weight:800;color:var(--accent);text-align:center}.status{font-weight:700;color:var(--muted)}.status.error{color:var(--danger)}pre{padding:14px;border-radius:12px;background:#172033;color:#dbe8ff;white-space:pre-wrap}@media(max-width:720px){.row{grid-template-columns:1fr}}
</style></head><body><main><h1>CountAPI Counter</h1><p>シンプルなカウンターAPIです。ページ閲覧数やボタンクリック回数のプロトタイプに使えます。</p><section class="panel"><div class="row"><div><label>namespace</label><input id="ns" value="teamt-webapi"></div><div><label>key</label><input id="key" value="demo"></div></div><button id="hit">+1 する</button><div class="num" id="num">-</div><p class="status" id="status">未実行です。</p><pre id="raw"></pre><p style="font-size:12px">Docs: <a href="https://countapi.xyz" target="_blank" rel="noreferrer">https://countapi.xyz</a></p></section></main><script>
document.getElementById("hit").addEventListener("click",async()=>{const ns=document.getElementById("ns").value,key=document.getElementById("key").value,status=document.getElementById("status"),raw=document.getElementById("raw");try{status.className="status";status.textContent="送信中...";const r=await fetch(`https://api.countapi.xyz/hit/${encodeURIComponent(ns)}/${encodeURIComponent(key)}`);if(!r.ok)throw new Error(`HTTP ${r.status}`);const d=await r.json();document.getElementById("num").textContent=d.value;status.textContent="成功: カウントしました。";raw.textContent=JSON.stringify(d,null,2)}catch(e){status.className="status error";status.textContent="取得不可。ローカル表示に切り替えました。";const v=Number(localStorage.getItem("countapi-fallback")||0)+1;localStorage.setItem("countapi-fallback",v);document.getElementById("num").textContent=v;raw.textContent=JSON.stringify({fallback:true,value:v,message:e.message},null,2)}})
</script></body></html>
