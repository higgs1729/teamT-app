<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>DropMail GraphQL Notes</title><style>body{font-family:"BIZ UDPGothic","Meiryo UI",sans-serif;margin:0;min-height:100vh;background:#f6f7fb;color:#202536}main{width:min(900px,100%);margin:auto;padding:34px 18px}.panel{background:#fff;border:1px solid #dde5ef;border-radius:15px;padding:18px}pre{padding:14px;border-radius:12px;background:#172033;color:#dbe8ff;white-space:pre-wrap}p,li{color:#667086;line-height:1.7}a{color:#2f6ef0}</style></head><body><main><h1>DropMail GraphQL Notes</h1><p>一時メール inbox を作成・管理するGraphQL API候補です。ここでは悪用防止のためリクエスト形状のみ表示します。</p><section class="panel"><pre>mutation {
