<!DOCTYPE html>
<!-- ExtendsClass JSON Storage紹介ページ: JSON保存API候補の使い方を、CORS時のローカル保存フォールバック込みで示す。 -->
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ExtendsClass JSON Storage</title><style>
:root{--ink:#202536;--muted:#667086;--line:#dde5ef;--accent:#1f8a70;--soft:#e8f6f2;--danger:#c43d3d}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"BIZ UDPGothic","Meiryo UI",sans-serif;background:linear-gradient(135deg,#f6f7fb,#eef8f4);color:var(--ink)}main{width:min(980px,100%);margin:auto;padding:32px 18px}h1{margin:0 0 8px;font-size:clamp(24px,4vw,38px);letter-spacing:0}p{margin:0;color:var(--muted);line-height:1.7}a{color:var(--accent)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:0 14px 30px rgba(40,70,58,.08)}textarea,button{width:100%;font:inherit;border-radius:10px;padding:11px 12px}textarea{min-height:270px;border:1px solid var(--line);font-family:Consolas,monospace}button{margin-top:12px;border:0;background:var(--accent);color:#fff;font-weight:700}.status{font-weight:700;color:var(--muted);margin-bottom:10px}.status.error{color:var(--danger)}pre{min-height:320px;margin:0;padding:14px;border-radius:12px;background:#172033;color:#dbe8ff;white-space:pre-wrap;overflow:auto}@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style></head><body><main><h1>ExtendsClass JSON Storage</h1><p>簡易JSONストレージAPI候補です。APIが利用できない場合はlocalStorageへ保存し、プロトタイプ用途を確認できます。</p><section class="grid"><section class="panel"><textarea id="json">{"project":"teamT-app","type":"webapi-demo","savedAt":"2026-07-07"}</textarea><button id="save">保存を試す</button><p style="margin-top:12px;font-size:12px">Docs: <a href="https://extendsclass.com/json-storage.html" target="_blank" rel="noreferrer">https://extendsclass.com/json-storage.html</a></p></section><section class="panel"><p class="status" id="status">未保存です。</p><pre id="out"></pre></section></section></main><script>
document.getElementById("save").addEventListener("click",async()=>{const text=document.getElementById("json").value,status=document.getElementById("status"),out=document.getElementById("out");try{JSON.parse(text);status.className="status";status.textContent="API保存を試行中...";const r=await fetch("https://json.extendsclass.com/bin",{method:"POST",headers:{"Content-Type":"application/json"},body:text});if(!r.ok)throw new Error(`HTTP ${r.status}`);const data=await r.text();status.textContent="APIへ保存しました。";out.textContent=data;}catch(e){status.className="status error";status.textContent="API保存不可のためlocalStorageに保存しました。";localStorage.setItem("extendsclass-json-storage-demo",text);out.textContent=JSON.stringify({fallback:true,key:"extendsclass-json-storage-demo",message:e.message,json:JSON.parse(text)},null,2);}});
</script></body></html>
