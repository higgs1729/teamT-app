<!DOCTYPE html>
<!-- HTTP2.Pro紹介ページ: URLのHTTP/2対応チェックAPI候補を試す。 -->
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>HTTP2.Pro Checker</title><style>
:root{--ink:#202536;--muted:#667086;--line:#dde5ef;--accent:#1f8a70;--soft:#e8f6f2;--danger:#c43d3d}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"BIZ UDPGothic","Meiryo UI",sans-serif;background:linear-gradient(135deg,#f6f7fb,#eef8f4);color:var(--ink)}main{width:min(900px,100%);margin:auto;padding:34px 18px}h1{margin:0 0 8px;font-size:clamp(24px,4vw,38px);letter-spacing:0}p{margin:0;color:var(--muted);line-height:1.7}a{color:var(--accent)}form{display:flex;gap:10px;margin:18px 0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}input,button{font:inherit;border-radius:10px;padding:11px 12px}input{flex:1;border:1px solid var(--line)}button{border:0;background:var(--accent);color:#fff;font-weight:700}.status{font-weight:700;color:var(--muted);margin-bottom:10px}.status.error{color:var(--danger)}.box{padding:18px;border-radius:14px;background:var(--soft);min-height:180px;white-space:pre-wrap}@media(max-width:760px){form{display:grid}}
</style></head><body><main><h1>HTTP2.Pro Checker</h1><p>指定URLがHTTP/2に対応しているか確認するAPI候補です。公開仕様に合わせて問い合わせURLを作成します。</p><form id="form"><input id="url" value="https://example.com"><button>チェック</button></form><p class="status" id="status">未実行です。</p><div class="box" id="out"></div><p style="font-size:12px">Docs: <a href="https://http2.pro/doc/api" target="_blank" rel="noreferrer">https://http2.pro/doc/api</a></p></main><script>
document.getElementById("form").addEventListener("submit",async e=>{e.preventDefault();const target=document.getElementById("url").value,status=document.getElementById("status"),out=document.getElementById("out"),api=`https://http2.pro/api/v1?url=${encodeURIComponent(target)}`;try{status.className="status";status.textContent="確認中...";const r=await fetch(api);if(!r.ok)throw new Error(`HTTP ${r.status}`);const d=await r.json();status.textContent="成功: 判定結果を取得しました。";out.textContent=JSON.stringify(d,null,2);}catch(err){status.className="status error";status.textContent="取得不可。API URL例を表示します。";out.textContent=JSON.stringify({api,target,fallback:true,message:err.message},null,2);}});
</script></body></html>
