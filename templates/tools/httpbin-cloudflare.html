<!DOCTYPE html>
<!-- Httpbin Cloudflare紹介ページ: Cloudflare版HttpbinでHTTP/3系検証API候補を表示する。 -->
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Httpbin Cloudflare Lab</title><style>
:root{--ink:#202536;--muted:#667086;--line:#dde5ef;--accent:#f48120;--danger:#c43d3d}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"BIZ UDPGothic","Meiryo UI",sans-serif;background:linear-gradient(135deg,#f6f7fb,#fff4e8);color:var(--ink)}main{width:min(980px,100%);margin:auto;padding:32px 18px}h1{margin:0 0 8px;font-size:clamp(24px,4vw,38px);letter-spacing:0}p{margin:0;color:var(--muted);line-height:1.7}a{color:var(--accent)}button{margin:18px 0;border:0;border-radius:10px;padding:12px 16px;background:var(--accent);color:#fff;font:inherit;font-weight:700}.status{font-weight:700;color:var(--muted);margin-bottom:10px}.status.error{color:var(--danger)}pre{padding:14px;border-radius:12px;background:#172033;color:#dbe8ff;white-space:pre-wrap;min-height:360px}
</style></head><body><main><h1>Httpbin Cloudflare Lab</h1><p>Cloudflareが提供するHttpbin互換API候補です。通常のHttpbinと似たレスポンスを、Cloudflare配信環境で確認できます。</p><button id="load">GET echoを取得</button><p class="status" id="status">未取得です。</p><pre id="out"></pre><p style="font-size:12px">Docs: <a href="https://cloudflare-quic.com/b/" target="_blank" rel="noreferrer">https://cloudflare-quic.com/b/</a></p></main><script>
document.getElementById("load").addEventListener("click",async()=>{const status=document.getElementById("status"),out=document.getElementById("out"),url="https://cloudflare-quic.com/b/get?sample=teamt";try{status.className="status";status.textContent="取得中...";const r=await fetch(url);if(!r.ok)throw new Error(`HTTP ${r.status}`);const d=await r.json();status.textContent="成功: Cloudflare版レスポンスを取得しました。";out.textContent=JSON.stringify(d,null,2);}catch(err){status.className="status error";status.textContent="取得不可。通常Httpbinの利用も検討してください。";out.textContent=JSON.stringify({url,fallback:true,message:err.message},null,2);}});
</script></body></html>
