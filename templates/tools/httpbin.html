<!DOCTYPE html>
<!-- Httpbin紹介ページ: HTTPリクエスト/レスポンス検証APIでheaders・json・delayを試す。 -->
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Httpbin Request Lab</title><style>
:root{--ink:#202536;--muted:#667086;--line:#dde5ef;--accent:#2f6ef0;--danger:#c43d3d}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"BIZ UDPGothic","Meiryo UI",sans-serif;background:linear-gradient(135deg,#f6f7fb,#eef7ff);color:var(--ink)}main{width:min(980px,100%);margin:auto;padding:32px 18px}h1{margin:0 0 8px;font-size:clamp(24px,4vw,38px);letter-spacing:0}p{margin:0;color:var(--muted);line-height:1.7}a{color:var(--accent)}.bar{display:flex;gap:10px;margin:18px 0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}select,button{font:inherit;border-radius:10px;padding:11px 12px}select{flex:1;border:1px solid var(--line)}button{border:0;background:var(--accent);color:#fff;font-weight:700}.status{font-weight:700;color:var(--muted);margin-bottom:10px}.status.error{color:var(--danger)}pre{padding:14px;border-radius:12px;background:#172033;color:#dbe8ff;white-space:pre-wrap;min-height:360px}@media(max-width:760px){.bar{display:grid}}
</style></head><body><main><h1>Httpbin Request Lab</h1><p>HTTPリクエストの挙動確認に使われる定番APIです。headers、JSON、delayなどを切り替えて取得します。</p><section class="bar"><select id="ep"><option value="/get?sample=teamt">GET echo</option><option value="/headers">Headers</option><option value="/json">JSON sample</option><option value="/delay/1">Delay 1s</option></select><button id="load">取得</button></section><p class="status" id="status">未取得です。</p><pre id="out"></pre><p style="font-size:12px">Docs: <a href="https://httpbin.org/" target="_blank" rel="noreferrer">https://httpbin.org/</a></p></main><script>
document.getElementById("load").addEventListener("click",async()=>{const ep=document.getElementById("ep").value,status=document.getElementById("status"),out=document.getElementById("out");try{status.className="status";status.textContent="取得中...";const r=await fetch(`https://httpbin.org${ep}`);if(!r.ok)throw new Error(`HTTP ${r.status}`);const d=await r.json();status.textContent="成功: レスポンスを取得しました。";out.textContent=JSON.stringify(d,null,2);}catch(err){status.className="status error";status.textContent="取得に失敗しました。";out.textContent=JSON.stringify({fallback:true,message:err.message},null,2);}});
</script></body></html>
