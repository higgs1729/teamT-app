<!DOCTYPE html>
<!-- Kroki紹介ページ: Mermaidなどのテキスト図を画像化するAPI。 -->
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Kroki Diagram Renderer</title><style>
body{margin:0;min-height:100vh;font-family:"BIZ UDPGothic","Meiryo UI",sans-serif;background:linear-gradient(135deg,#f6f7fb,#eef7ff);color:#202536}main{width:min(1000px,100%);margin:auto;padding:34px 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:#fff;border:1px solid #dde5ef;border-radius:15px;padding:18px}textarea{width:100%;min-height:300px;font-family:Consolas,monospace;border:1px solid #dde5ef;border-radius:10px;padding:12px}button{border:0;border-radius:10px;padding:12px 16px;background:#2f6ef0;color:#fff;font:inherit;font-weight:700;margin-top:10px}img{max-width:100%;background:#fff;border-radius:12px}p{color:#667086;line-height:1.7}a{color:#2f6ef0}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>Kroki Diagram Renderer</h1><p>Mermaidなどのテキスト図を画像化するAPIです。</p><section class="grid"><section class="panel"><textarea id="src">graph TD
  A[URL] --> B[HTML]
  B --> C[catalog.js]</textarea><button id="render">図を生成</button><p>Docs: <a href="https://kroki.io" target="_blank" rel="noreferrer">kroki.io</a></p></section><section class="panel"><img id="img" alt="diagram"></section></section></main><script>
function b64(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_")}document.getElementById("render").onclick=()=>{document.getElementById("img").src=`https://kroki.io/mermaid/svg/${b64(document.getElementById("src").value)}`};document.getElementById("render").click();
</script></body></html>
